<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rive-harness</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
      }
      #canvas {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <script src="/assets/rive.js"></script>
    <script>
      window.__RIVE_OK = false;
      window.__RIVE_ERROR = "";
      const params = new URLSearchParams(window.location.search);
      const logicalWidth = Number(params.get("width") || String(window.innerWidth));
      const logicalHeight = Number(params.get("height") || String(window.innerHeight));
      const dpr = Number(params.get("dpr") || String(window.devicePixelRatio || 1));
      const canvas = document.getElementById("canvas");
      canvas.style.width = `${logicalWidth}px`;
      canvas.style.height = `${logicalHeight}px`;
      canvas.width = Math.round(logicalWidth * dpr);
      canvas.height = Math.round(logicalHeight * dpr);
      rive.RuntimeLoader.setWasmUrl("/assets/rive.wasm");

      const file = params.get("file");
      const artboard = params.get("artboard");
      if (!file) {
        window.__RIVE_ERROR = "missing file query param";
      } else {
        try {
          const opts = {
            src: file,
            canvas,
            autoplay: true,
            onLoad: () => {
              window.__RIVE_OK = true;
            },
            onLoadError: (error) => {
              window.__RIVE_ERROR = String(error || "rive load error");
            },
          };
          if (artboard) {
            opts.artboard = artboard;
          }
          window.__RIVE_INSTANCE = new rive.Rive(opts);
        } catch (error) {
          window.__RIVE_ERROR = String(error || "rive init error");
        }
      }
    </script>
  </body>
</html>
