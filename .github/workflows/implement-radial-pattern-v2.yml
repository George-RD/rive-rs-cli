name: Implement radial pattern contract v2

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/implement-radial-pattern-v2.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Confirm the contract remains red
        run: |
          mkdir -p target/radial-evidence
          set +e
          cargo test --locked --test authoring_radial_contract \
            radial_patterns_expand_deterministically_and_build -- --exact --nocapture \
            > target/radial-evidence/red.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Eq 'unknown variant .radial.' target/radial-evidence/red.log

      - name: Apply the implementation with the corrected insertion marker
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(ARGV[0])
            step = workflow.fetch("jobs").fetch("implement").fetch("steps").find do |candidate|
              candidate["name"] == "Implement shared pattern plumbing and radial lowering"
            end
            abort "implementation step missing" unless step
            File.write(ARGV[1], step.fetch("run"))
          ' .github/workflows/implement-radial-pattern.yml /tmp/apply-radial.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/apply-radial.sh")
          script = path.read_text()
          label = script.index('"pattern descriptors"')
          start = script.rfind("visual = replace_once(", 0, label)
          next_block = script.index("\nvisual = replace_once(", label)
          replacement = r'''descriptor_types = ''' + "'''" + r'''#[derive(Clone, Copy)]
          pub(crate) struct RadialNodeRef<'a> {
              pub copies: u64,
              pub radius: &'a ScalarExpr,
              pub start_angle: &'a ScalarExpr,
              pub angle_step: &'a ScalarExpr,
              pub rotate_items: bool,
              pub item: &'a VisualNode,
              pub transform: &'a TransformSpec,
          }

          #[derive(Clone, Copy)]
          pub(crate) enum PatternNodeRef<'a> {
              Grid(GridNodeRef<'a>),
              Radial(RadialNodeRef<'a>),
          }

          impl<'a> PatternNodeRef<'a> {
              pub(crate) fn item(self) -> &'a VisualNode {
                  match self {
                      Self::Grid(grid) => grid.item,
                      Self::Radial(radial) => radial.item,
                  }
              }
          }

          ''' + "'''" + r'''
          visual = replace_once(
              visual,
              "\nimpl VisualNode {\n",
              "\n" + descriptor_types + "impl VisualNode {\n",
              "pattern descriptors",
          )
          '''
          script = script[:start] + replacement + script[next_block + 1 :]
          path.write_text(script)
          PY

          bash /tmp/apply-radial.sh

      - name: Prove the radial contract is green
        run: |
          set -o pipefail
          cargo test --locked --test authoring_radial_contract \
            2>&1 | tee target/radial-evidence/targeted-green.log

      - name: Run Rust quality gates
        run: |
          set -o pipefail
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings \
            2>&1 | tee target/radial-evidence/clippy-green.log
          cargo test --locked --all-features \
            2>&1 | tee target/radial-evidence/rust-green.log

      - name: Reconcile and lint Cairn
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          set -o pipefail
          cairn scan --json | tee target/radial-evidence/cairn-scan.json
          cairn lint --json | tee target/radial-evidence/cairn-lint.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radial-pattern-tdd-evidence-v2
          path: target/radial-evidence
          retention-days: 7

      - name: Commit verified implementation
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            cairn.blueprint \
            docs/authoring.schema.v0.json \
            map.json \
            meta/todos/todo.visual-authoring-compiler.md \
            src/authoring/frontend.rs \
            src/authoring/limits.rs \
            src/authoring/lower/node.rs \
            src/authoring/lower/pattern.rs \
            src/authoring/validation.rs \
            src/authoring/visual.rs \
            tests/authoring_radial_contract.rs
          git diff --cached --stat
          git commit -m "feat: add bounded radial patterns"
          git push origin HEAD:${{ github.head_ref }}
