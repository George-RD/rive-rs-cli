name: Separate authoring limits

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/simple-constraints-v0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simple-constraints-v0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: python .github/separate-authoring-limits.py
      - run: cargo fmt --all
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features --test authoring_along_path_contract --test authoring_constraint_contract --test authoring_constraint_safety_contract
      - name: Commit verified limit separation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authoring/limits.rs src/authoring/constraint.rs meta/todos/todo.visual-authoring-compiler.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Separate authoring safety limits"
          git push
