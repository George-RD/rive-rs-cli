name: Issue 179 authoring schema regen

on:
  push:
    branches:
      - issue-179-typed-behavior
    paths:
      - scripts/issue179_authoring_schema_regen_trigger

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate authoring schema
        run: cargo test regenerate_published_authoring_schema --test authoring_contract --locked -- --ignored
      - name: Commit schema
        shell: bash
        run: |
          if git diff --quiet -- docs/authoring.schema.v0.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/authoring.schema.v0.json
          git commit -m "docs(authoring): regenerate behavior schema"
          git push
