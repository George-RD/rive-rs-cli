name: Audit radial trig determinism

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/audit-radial-determinism.yml

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Record standard-library trig bit patterns
        shell: bash
        run: |
          cat > trig_probe.rs <<'RS'
          use std::f64::consts::{FRAC_PI_6, PI, TAU};

          fn main() {
              let cases = [
                  ("literal_0_1", 0.1_f64),
                  ("frac_pi_6", FRAC_PI_6),
                  ("degrees_30", 30.0_f64.to_radians()),
                  ("arbitrary", 1.234_567_890_123_45_f64),
                  ("near_pi", PI + f64::EPSILON),
                  ("many_turns", 123_456.789_f64 * TAU + 0.123_456_789_f64),
                  ("large_1e20", 1.0e20_f64),
                  ("f32_half_max", f64::from(f32::MAX / 2.0)),
              ];

              println!("case\tangle_bits\tsin_bits\tcos_bits\tf32_sin_bits\tf32_cos_bits");
              for (name, angle) in cases {
                  println!(
                      "{name}\t{:016x}\t{:016x}\t{:016x}\t{:08x}\t{:08x}",
                      angle.to_bits(),
                      angle.sin().to_bits(),
                      angle.cos().to_bits(),
                      (angle.sin() as f32).to_bits(),
                      (angle.cos() as f32).to_bits(),
                  );
              }
          }
          RS
          rustc trig_probe.rs -O -o trig_probe
          ./trig_probe | tee trig-${{ runner.os }}.tsv

      - name: Find standard-library and pure-Rust divergences
        shell: bash
        run: |
          mkdir -p trig_compare/src
          cat > trig_compare/Cargo.toml <<'TOML'
          [package]
          name = "trig-compare"
          version = "0.0.0"
          edition = "2024"

          [dependencies]
          libm = "=0.2.16"
          TOML
          cat > trig_compare/src/main.rs <<'RS'
          fn next(state: &mut u64) -> u64 {
              *state = state
                  .wrapping_mul(6_364_136_223_846_793_005)
                  .wrapping_add(1_442_695_040_888_963_407);
              *state
          }

          fn main() {
              let mut state = 0x7f4a_7c15_9e37_79b9_u64;
              let mut f64_differences = 0_u64;
              let mut f32_differences = 0_u64;
              let mut printed = 0_u64;

              for index in 0_u64..500_000 {
                  let raw = next(&mut state);
                  let magnitude = f32::from_bits((raw as u32) & 0x7f7f_ffff);
                  if !magnitude.is_finite() {
                      continue;
                  }
                  let sign = if raw & (1_u64 << 63) == 0 { 1.0 } else { -1.0 };
                  let offset = ((next(&mut state) >> 11) as f64) * (1.0 / ((1_u64 << 53) as f64));
                  let angle = sign * (f64::from(magnitude) + offset);

                  let std_sin = angle.sin();
                  let std_cos = angle.cos();
                  let libm_sin = libm::sin(angle);
                  let libm_cos = libm::cos(angle);
                  let differs = std_sin.to_bits() != libm_sin.to_bits()
                      || std_cos.to_bits() != libm_cos.to_bits();
                  let differs_after_f32 = (std_sin as f32).to_bits() != (libm_sin as f32).to_bits()
                      || (std_cos as f32).to_bits() != (libm_cos as f32).to_bits();

                  if differs {
                      f64_differences += 1;
                      if printed < 20 {
                          println!(
                              "diff\t{index}\t{:016x}\t{:016x}\t{:016x}\t{:016x}\t{:016x}\t{:08x}\t{:08x}\t{:08x}\t{:08x}",
                              angle.to_bits(),
                              std_sin.to_bits(),
                              libm_sin.to_bits(),
                              std_cos.to_bits(),
                              libm_cos.to_bits(),
                              (std_sin as f32).to_bits(),
                              (libm_sin as f32).to_bits(),
                              (std_cos as f32).to_bits(),
                              (libm_cos as f32).to_bits(),
                          );
                          printed += 1;
                      }
                  }
                  if differs_after_f32 {
                      f32_differences += 1;
                  }
              }

              println!("summary\tf64_differences={f64_differences}\tf32_differences={f32_differences}");
          }
          RS
          cargo run --quiet --release --manifest-path trig_compare/Cargo.toml \
            | tee trig-compare-${{ runner.os }}.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: trig-${{ runner.os }}
          path: |
            trig-${{ runner.os }}.tsv
            trig-compare-${{ runner.os }}.tsv
          retention-days: 7
