name: Authoring exit-time workbench

on:
  push:
    branches: [agent/authoring-exit-time]

permissions:
  contents: write

concurrency:
  group: authoring-exit-time-workbench
  cancel-in-progress: true

jobs:
  workbench:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply reviewed source edits
        run: python3 .github/authoring-workbench.py
      - name: Format and regenerate schemas
        run: |
          cargo fmt
          cargo test --locked --test authoring_contract regenerate_published_authoring_schema -- --ignored
          UPDATE_SCENE_SCHEMA=1 cargo test --locked --lib scene_schema_file_is_in_sync
      - name: Check selected public contracts
        run: |
          cargo test --locked --test authoring_transition_exit_time_contract
          cargo test --locked --test authoring_transition_duration_contract
          cargo clippy --all-targets --all-features -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check official-runtime evidence
        run: |
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium
          node tests/playwright/authoring-behavior-runtime.js
      - name: Check Cairn context and ownership
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cairn context > /tmp/cairn-context.txt
          cairn scan --json > /tmp/cairn-scan.json
          cairn lint --json > /tmp/cairn-lint.json
      - name: Commit verified edits on the work branch only
        run: |
          git diff --check
          git add -u -- src tests docs meta CHANGELOG.md ROADMAP.md cairn.blueprint
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(authoring): verify animation exit-time gates and runtime evidence (#227)'
            git push origin HEAD:refs/heads/agent/authoring-exit-time
          fi
          git archive --format=tar.gz HEAD -o /tmp/rive-source.tar.gz
      - name: Collect diagnostic patch
        if: always()
        run: git diff > /tmp/workbench.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authoring-workbench-source
          path: |
            /tmp/rive-source.tar.gz
            /tmp/workbench.patch
            /tmp/cairn-context.txt
            /tmp/cairn-scan.json
            /tmp/cairn-lint.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authoring-workbench-runtime
          path: target/playwright-behavior
          retention-days: 7
