name: Stage radial determinism red contract

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/stage-radial-determinism-red.yml

permissions:
  contents: write

jobs:
  red:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Add the pinned bit-level contract
        shell: bash
        run: |
          set -euo pipefail
          cat >> tests/authoring_radial_contract.rs <<'RS'

          #[test]
          fn radial_coordinates_use_pinned_deterministic_trigonometry() {
              // The standard library produced different cosine bits for this exact angle
              // across the Linux/Windows and macOS audit runners. The expected bits are
              // pinned to the repository's pure-Rust trigonometric contract.
              let angle = f64::from_bits(0xbfe9_0003_ce1c_711f);
              let input = document(vec![radial(
                  "deterministic-orbit",
                  1,
                  literal(1.0, "px"),
                  literal(angle, "radians"),
                  literal(0.0, "radians"),
                  false,
                  rectangle("tile"),
              )]);

              let lowered = lower_authoring_json(&input).expect("deterministic radial lowering");
              let cell = &lowered.scene["artboard"]["children"][0]["children"][0];
              assert_eq!(
                  cell["x"].as_f64().expect("radial x").to_bits(),
                  0x3fe6_b896_4cae_d975,
                  "radial x must use the pinned pure-Rust cosine result"
              );
              assert_eq!(
                  cell["y"].as_f64().expect("radial y").to_bits(),
                  0xbfe6_888d_01ba_048a,
                  "radial y must use the pinned pure-Rust sine result"
              );
          }
          RS
          cargo fmt --all

      - name: Prove the current standard-library path is red
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/radial-determinism-evidence
          set +e
          cargo test --locked --test authoring_radial_contract \
            radial_coordinates_use_pinned_deterministic_trigonometry -- --exact --nocapture \
            > target/radial-determinism-evidence/red.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "determinism contract unexpectedly passed before implementation"
            cat target/radial-determinism-evidence/red.log
            exit 1
          fi
          grep -q "radial x must use the pinned pure-Rust cosine result" \
            target/radial-determinism-evidence/red.log

      - uses: actions/upload-artifact@v4
        with:
          name: radial-determinism-red-evidence
          path: target/radial-determinism-evidence/red.log
          retention-days: 7

      - name: Commit the failing contract and remove audit scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/audit-radial-determinism.yml \
            .github/workflows/stage-radial-determinism-red.yml
          git add tests/authoring_radial_contract.rs
          git diff --cached --check
          git commit -m "test: pin radial coordinate determinism"
          git push origin HEAD:${{ github.head_ref }}
