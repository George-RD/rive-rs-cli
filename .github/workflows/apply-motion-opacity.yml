name: Apply motion opacity slice

on:
  push:
    branches: [agent/motion-opacity]
    paths:
      - .github/workflows/apply-motion-opacity.yml

permissions:
  contents: write

concurrency:
  group: apply-motion-opacity
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/motion-opacity
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply bounded implementation
        run: |
          python3 scripts/apply_motion_opacity.py
          rm scripts/apply_motion_opacity.py .github/workflows/apply-motion-opacity.yml
      - name: Format Rust sources
        run: cargo fmt
      - name: Regenerate public authoring schema
        run: cargo test --test authoring_contract regenerate_published_authoring_schema -- --ignored
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
      - name: Regenerate and validate architecture evidence
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cairn scan --json | tee /tmp/cairn-scan.json
          cairn lint --json | tee /tmp/cairn-lint.json
      - name: Run focused opacity contract
        run: cargo test --test authoring_motion_opacity_contract
      - name: Run formatting and Clippy gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Run complete Rust suite
        run: cargo test --locked --all-features
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(authoring): lower typed opacity tracks"
          git push origin HEAD:agent/motion-opacity
