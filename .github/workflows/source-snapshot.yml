name: Apply Stroke Implementation

on:
  pull_request:
    paths:
      - .github/workflows/source-snapshot.yml
      - .agent/stroke-implementation.patch.gz.b64

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply implementation
        run: |
          base64 --decode .agent/stroke-implementation.patch.gz.b64 | gzip --decompress > /tmp/stroke.patch
          git apply --check /tmp/stroke.patch
          git apply /tmp/stroke.patch
          cargo fmt --all
          cat > examples/__dump_authoring_schema.rs <<'RS'
          fn main() {
              let schema = rive_cli::authoring::authoring_schema();
              println!("{}", serde_json::to_string_pretty(&schema).expect("serialize schema"));
          }
          RS
          cargo run --quiet --example __dump_authoring_schema > docs/authoring.schema.v0.json
          rm examples/__dump_authoring_schema.rs
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Validate Cairn graph
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cairn scan
          cairn lint
      - name: Commit implementation
        run: |
          rm .agent/stroke-implementation.patch.gz.b64
          rm .github/workflows/source-snapshot.yml
          rmdir .agent 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add typed stroke paint to authored shapes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
