name: Source Snapshot

on:
  pull_request:
    paths:
      - .github/workflows/source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive working tree
        run: tar --exclude=.git --exclude=target -czf /tmp/source-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: /tmp/source-snapshot.tar.gz
          retention-days: 1
