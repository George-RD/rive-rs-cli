name: Source snapshot

on:
  push:
    branches: [agent/cairn-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cairn-foundation
      - name: Apply staged foundation refactor
        run: |
          python3 -c 'import base64, io, pathlib, tarfile; payload = base64.b64decode(pathlib.Path(".github/foundation-files.b64").read_text()); tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz").extractall(".")'
          rm .github/foundation-files.b64
      - name: Persist foundation refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: establish command and eval foundation"
          git push origin HEAD:agent/cairn-foundation
      - name: Install Cairn
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
      - name: Bootstrap Cairn from the codebase
        id: bootstrap
        continue-on-error: true
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          set -o pipefail
          {
            command -v cairn
            cairn --version
            cairn init --from-code --apply --wire
            cairn scan
            cairn lint --json > .cairn/bootstrap-lint.json || true
          } 2>&1 | tee cairn-bootstrap.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cairn-bootstrap
          path: .
          include-hidden-files: true
          retention-days: 1
      - name: Fail when bootstrap failed
        if: steps.bootstrap.outcome == 'failure'
        run: exit 1
