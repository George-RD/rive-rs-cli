name: Source snapshot

on:
  push:
    branches: [agent/cairn-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
