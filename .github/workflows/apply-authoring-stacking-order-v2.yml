name: Apply authoring stacking order v2

on:
  push:
    branches:
      - agent/authoring-stacking-order

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: agent/authoring-stacking-order
      REPOSITORY: George-RD/rive-rs-cli
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authoring-stacking-order
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply source transformation when needed
        shell: bash
        run: |
          if ! grep -q "pub enum StackingOrder" src/authoring/visual.rs; then
            python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-authoring-stacking-order.yml")
          if not workflow.exists():
              raise SystemExit("original implementation workflow is unavailable")
          lines = workflow.read_text().splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python3 - <<'PY'")
          end = next(index for index in range(start + 1, len(lines)) if lines[index].strip() == "PY")
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines[start:end + 1]) + "\n"
          Path("/tmp/apply-stacking-order.sh").write_text(script)
          PY
            bash /tmp/apply-stacking-order.sh
          fi
          cargo fmt --all
      - name: Repair internal struct literals
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def diagnostics():
              result = subprocess.run(
                  ["cargo", "check", "--locked", "--all-targets", "--all-features", "--message-format=json"],
                  text=True,
                  capture_output=True,
              )
              errors = []
              for line in result.stdout.splitlines():
                  try:
                      payload = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  message = payload.get("message")
                  if message and message.get("level") == "error":
                      errors.append(message)
              return result.returncode, errors

          for _ in range(8):
              returncode, errors = diagnostics()
              if returncode == 0:
                  break
              changes = []
              for error in errors:
                  message = error.get("message", "")
                  if "missing field `stacking`" not in message:
                      continue
                  spans = [span for span in error.get("spans", []) if span.get("is_primary")]
                  if not spans:
                      continue
                  span = spans[0]
                  path = Path(span["file_name"])
                  source = path.read_text()
                  start = span["byte_start"]
                  end = span["byte_end"]
                  snippet = source[start:end]
                  if "initializer" in message:
                      opening = snippet.find("{")
                      if opening < 0:
                          continue
                      line = source[: start + opening].splitlines()[-1]
                      indent = " " * (len(line) - len(line.lstrip()) + 4)
                      replacement = snippet[: opening + 1] + "\n" + indent + "stacking: Default::default()," + snippet[opening + 1 :]
                  elif "pattern" in message:
                      opening = snippet.find("{")
                      if opening < 0:
                          continue
                      line = source[: start + opening].splitlines()[-1]
                      indent = " " * (len(line) - len(line.lstrip()) + 4)
                      replacement = snippet[: opening + 1] + "\n" + indent + "stacking: _," + snippet[opening + 1 :]
                  else:
                      continue
                  changes.append((path, start, end, replacement))
              if not changes:
                  details = "\n".join(error.get("rendered", error.get("message", "")) for error in errors)
                  raise SystemExit(details)
              grouped = {}
              for change in changes:
                  grouped.setdefault(change[0], []).append(change[1:])
              for path, edits in grouped.items():
                  source = path.read_text()
                  for start, end, replacement in sorted(edits, reverse=True):
                      source = source[:start] + replacement + source[end:]
                  path.write_text(source)
          else:
              raise SystemExit("struct literal repair did not converge")

          returncode, errors = diagnostics()
          if returncode != 0:
              details = "\n".join(error.get("rendered", error.get("message", "")) for error in errors)
              raise SystemExit(details)
          PY
          cargo fmt --all
      - name: Synchronize schema
        shell: bash
        run: |
          cat > examples/__generate_authoring_schema.rs <<'RS'
          use rive_cli::authoring::authoring_schema;

          fn main() {
              println!(
                  "{}",
                  serde_json::to_string_pretty(&authoring_schema()).expect("schema must serialize")
              );
          }
          RS
          cargo run --quiet --example __generate_authoring_schema > docs/authoring.schema.v0.json
          rm examples/__generate_authoring_schema.rs
          cargo fmt --all
      - name: Commit implementation handoff
        shell: bash
        run: |
          rm -f .github/workflows/implement-stacking-order.yml
          rm -f .github/workflows/apply-authoring-stacking-order.yml
          rm -f .github/workflows/apply-authoring-stacking-order-v2.yml
          rm -f .github/workflows/finalize-authoring-stacking-order.yml
          rm -f .github/workflows/finalize-authoring-stacking-order-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make authoring stacking order explicit" || true
          git push origin HEAD:"$BRANCH"
