name: Patch mirror public API

on:
  push:
    branches: [agent/mirror-pattern-v0]
    paths: [.github/workflows/patch-mirror-public-api.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mirror-pattern-v0
      - name: Re-export MirrorAxis
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/authoring/mod.rs")
          content = path.read_text()
          before = "pub use visual::VisualNode;"
          after = "pub use visual::{MirrorAxis, VisualNode};"
          if before not in content:
              raise SystemExit("expected public VisualNode re-export was not found")
          path.write_text(content.replace(before, after, 1))
          PY
      - name: Commit public API cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authoring/mod.rs
          git commit -m "refactor: expose typed mirror axis"
          git push origin HEAD:agent/mirror-pattern-v0
