name: Apply focused repair characterization

on:
  push:
    branches: [agent/repair-duplicate-reference]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-duplicate-reference
      - name: Replace the focused characterization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/ai/repair.rs")
          source = path.read_text()
          start_marker = "    #[test]\n    fn test_deduplicate_names_preserves_ambiguous_reference() {"
          end_marker = "    #[test]\n    fn test_clamp_color_short() {"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = """    #[test]
          fn test_deduplicate_names_preserves_ambiguous_reference() {
              let mut json = serde_json::json!({
                  \"children\": [
                      {\"name\": \"foo\"},
                      {\"name\": \"foo\"},
                      {\"name\": \"foo\"},
                      {\"name\": \"reference-holder\", \"object\": \"foo\"}
                  ]
              });

              let fixes = deduplicate_names(&mut json);

              assert_eq!(fixes.len(), 2);
              assert_eq!(json[\"children\"][0][\"name\"], \"foo\");
              assert_eq!(json[\"children\"][1][\"name\"], \"foo_2\");
              assert_eq!(json[\"children\"][2][\"name\"], \"foo_3\");
              assert_eq!(json[\"children\"][3][\"object\"], \"foo\");
          }

          """.replace("          ", "")
          path.write_text(source[:start] + replacement + source[end:])
          PY
          cargo fmt
          rm .github/workflows/apply-repair-characterization.yml
      - name: Persist the characterization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(repair): exercise traversed duplicate reference"
          git push origin HEAD:agent/repair-duplicate-reference
