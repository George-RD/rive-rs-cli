name: Finalize AuthoringSpec Stacking

on:
  push:
    branches:
      - agent/authoring-stacking-order

permissions:
  actions: write
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authoring-stacking-order
          fetch-depth: 0
      - name: Add permanent runtime gate and remove temporary runners
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          before = '''      - run: npx playwright install --with-deps chromium
                - name: Run typed behavior runtime contract
          '''
          after = '''      - run: npx playwright install --with-deps chromium
                - name: Run AuthoringSpec stacking runtime contract
                  run: |
                    RIVE_CHROME="$(node --input-type=module -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())')" \\
                      cargo test --locked --test authoring_stacking_runtime -- --ignored
                - name: Run typed behavior runtime contract
          '''
          if before not in text:
              raise SystemExit('Playwright insertion seam not found')
          path.write_text(text.replace(before, after, 1))
          PY
          git rm .github/apply-authoring-stacking.py
          git rm .github/run-authoring-stacking.py
          git rm .github/workflows/apply-authoring-stacking.yml
          git rm .github/workflows/finalize-authoring-stacking.yml
      - name: Commit final branch state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml
          git commit -m "ci: retain AuthoringSpec stacking runtime proof"
          git push origin HEAD:agent/authoring-stacking-order
