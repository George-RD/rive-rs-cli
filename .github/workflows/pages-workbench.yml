name: Pages workbench
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/pages-workbench.yml']
permissions:
  contents: write
jobs:
  workbench:
    if: github.head_ref == 'feat/rive-native-pages' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 .pages-workbench/resize-fix.py
      - run: node --test tests/playwright/rive-page-contract.js tests/playwright/site-playback-contract.js tests/playwright/site-scheduling-contract.js tests/playwright/landing-lifecycle-contract.js
      - name: Commit verified source patch to the workbench branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$HEAD_BRANCH" = 'feat/rive-native-pages'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$HEAD_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/page.js site/page.css site/playback.js tests/playwright/site-playback-contract.js tests/playwright/rive-page-validation.js .pages-workbench
          git commit -m 'fix(site): keep paused artwork frozen during runtime resize and first paint'
          git push origin "HEAD:refs/heads/$HEAD_BRANCH"
      - run: npm install --no-save playwright@1.62.0
      - name: Capture and exercise generated interface
        env:
          RIVE_CHROME: /usr/bin/google-chrome
        run: |
          set -o pipefail
          node tests/playwright/rive-page-validation.js 2>&1 | tee page-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rive-page-second-pass
          path: |
            page-validation.log
            target/rive-page-evidence
          retention-days: 2
