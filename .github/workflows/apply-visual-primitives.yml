name: Apply visual primitives patch

on:
  push:
    branches:
      - agent/visual-primitives-v0
    paths:
      - .github/workflows/apply-visual-primitives.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-primitives-v0
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python tools/apply_visual_primitives.py
      - run: cargo fmt --all
      - run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authoring/spec.rs src/authoring/lower.rs src/authoring/frontend.rs src/authoring/limits.rs docs/authoring-spec-v0.md
          git commit -m "feat: add primitive geometry authoring nodes"
          git push origin HEAD:agent/visual-primitives-v0
