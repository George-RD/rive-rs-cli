name: Implement deterministic radial math

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/implement-radial-deterministic-math.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Confirm the pinned contract is red
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/radial-determinism-evidence
          set +e
          cargo test --locked --test authoring_radial_contract \
            radial_coordinates_use_pinned_deterministic_trigonometry -- --exact --nocapture \
            > target/radial-determinism-evidence/red.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "determinism contract unexpectedly passed before implementation"
            cat target/radial-determinism-evidence/red.log
            exit 1
          fi
          grep -q "radial x must use the pinned pure-Rust cosine result" \
            target/radial-determinism-evidence/red.log

      - name: Replace platform math with a pinned pure-Rust helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              file_path.write_text(text.replace(old, new, 1))

          replace_once(
              "Cargo.toml",
              'indexmap = { version = "2.7", features = ["serde"] }\n',
              'indexmap = { version = "2.7", features = ["serde"] }\nlibm = "=0.2.16"\n',
              "libm dependency insertion",
          )
          replace_once(
              "src/authoring/mod.rs",
              "mod expression;\n",
              "mod deterministic_math;\nmod expression;\n",
              "deterministic math module declaration",
          )
          replace_once(
              "src/authoring/expression.rs",
              "use super::spec::{AuthoringDiagnostic, Quantity, ScalarExpr, TransformSpec, Unit};\n",
              "use super::deterministic_math::radians_from_degrees;\n"
              "use super::spec::{AuthoringDiagnostic, Quantity, ScalarExpr, TransformSpec, Unit};\n",
              "degree conversion import",
          )
          replace_once(
              "src/authoring/expression.rs",
              "            value: evaluated.value.to_radians(),\n",
              "            value: radians_from_degrees(evaluated.value),\n",
              "deterministic degree conversion",
          )
          replace_once(
              "src/authoring/lower/pattern.rs",
              "use super::super::expression::{\n",
              "use super::super::deterministic_math::sin_cos;\n"
              "use super::super::expression::{\n",
              "deterministic trig import",
          )
          replace_once(
              "src/authoring/lower/pattern.rs",
              "                let x = radius * angle.cos();\n"
              "                let y = radius * angle.sin();\n",
              "                let (sine, cosine) = sin_cos(angle);\n"
              "                let x = radius * cosine;\n"
              "                let y = radius * sine;\n",
              "deterministic radial coordinates",
          )

          todo_path = Path("meta/todos/todo.visual-authoring-compiler.md")
          todo = todo_path.read_text()
          marker = (
              "- Deterministic bounded radial patterns are implemented in PR #147. They share pattern\n"
              "  traversal, expansion budgets, source-map lowering, and authored-path rewriting with\n"
              "  grids; radius and angular expressions flow through component overrides.\n"
          )
          progress = (
              "- A Linux/macOS/Windows bit audit found platform-dependent standard-library trig output;\n"
              "  authoring math now pins pure-Rust `libm` 0.2.16 and exact coordinate bits so radial\n"
              "  SceneSpec output remains reproducible across supported build hosts.\n"
          )
          if marker not in todo:
              raise SystemExit("radial roadmap marker missing")
          if progress not in todo:
              todo = todo.replace(marker, marker + progress, 1)
          todo_path.write_text(todo)
          PY

          cat > src/authoring/deterministic_math.rs <<'RS'
          use std::f64::consts::PI;

          const RADIANS_PER_DEGREE: f64 = PI / 180.0;

          pub(crate) fn radians_from_degrees(degrees: f64) -> f64 {
              degrees * RADIANS_PER_DEGREE
          }

          pub(crate) fn sin_cos(radians: f64) -> (f64, f64) {
              (libm::sin(radians), libm::cos(radians))
          }

          #[cfg(test)]
          mod tests {
              use super::{radians_from_degrees, sin_cos};

              #[test]
              fn degree_conversion_has_pinned_bits() {
                  assert_eq!(
                      radians_from_degrees(30.0).to_bits(),
                      0x3fe0_c152_382d_7365
                  );
              }

              #[test]
              fn trigonometry_has_pinned_bits() {
                  let angle = f64::from_bits(0xbfe9_0003_ce1c_711f);
                  let (sine, cosine) = sin_cos(angle);
                  assert_eq!(sine.to_bits(), 0xbfe6_888d_01ba_048a);
                  assert_eq!(cosine.to_bits(), 0x3fe6_b896_4cae_d975);
              }
          }
          RS

          cargo fmt --all
          cargo check --all-features

      - name: Prove targeted contracts are green
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo test --locked --test authoring_radial_contract \
              radial_coordinates_use_pinned_deterministic_trigonometry -- --exact
            cargo test --locked deterministic_math
          } 2>&1 | tee target/radial-determinism-evidence/targeted-green.log

      - name: Run Rust quality gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings \
            2>&1 | tee target/radial-determinism-evidence/clippy-green.log
          cargo test --locked --all-features \
            2>&1 | tee target/radial-determinism-evidence/rust-green.log

      - name: Reconcile and lint Cairn
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cairn scan --json | tee target/radial-determinism-evidence/cairn-scan.json
          cairn lint --json | tee target/radial-determinism-evidence/cairn-lint.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radial-determinism-implementation-evidence
          path: target/radial-determinism-evidence
          retention-days: 7

      - name: Commit verified implementation and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-radial-deterministic-math.yml
          git add \
            Cargo.toml \
            Cargo.lock \
            map.json \
            meta/todos/todo.visual-authoring-compiler.md \
            src/authoring/deterministic_math.rs \
            src/authoring/expression.rs \
            src/authoring/lower/pattern.rs \
            src/authoring/mod.rs \
            tests/authoring_radial_contract.rs
          git diff --cached --stat
          git commit -m "fix: make radial authoring math reproducible"
          git push origin HEAD:${{ github.head_ref }}

  cross-platform:
    needs: implement
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify exact radial coordinate bits
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test authoring_radial_contract \
            radial_coordinates_use_pinned_deterministic_trigonometry -- --exact --nocapture \
            | tee radial-determinism-${{ runner.os }}.log
      - uses: actions/upload-artifact@v4
        with:
          name: radial-determinism-${{ runner.os }}
          path: radial-determinism-${{ runner.os }}.log
          retention-days: 7
