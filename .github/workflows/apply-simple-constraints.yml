name: Apply simple constraints

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/simple-constraints-v0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simple-constraints-v0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: python .github/apply-simple-constraints.py
      - run: cargo fmt --all
      - run: cargo test --locked --all-features --test authoring_constraint_contract
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authoring
          git commit -m "Add simple group constraints"
          git push
      - name: Regenerate published schema
        run: cargo test --locked --all-features regenerate_published_authoring_schema -- --ignored
      - name: Commit generated schema
        run: |
          if git diff --quiet -- docs/authoring.schema.v0.json; then
            exit 0
          fi
          git add docs/authoring.schema.v0.json
          git commit -m "Regenerate authoring schema"
          git push
