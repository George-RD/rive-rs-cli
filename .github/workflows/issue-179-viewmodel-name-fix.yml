name: Issue 179 view-model wire-format fix

on:
  push:
    branches:
      - issue-179-typed-behavior
    paths:
      - scripts/issue179_viewmodel_name_fix_trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Align view-model component names with Rive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path("src/objects/core.rs")
          text = core.read_text()
          old = "    pub const COMPONENT_PARENT_ID: u16 = 5;\n"
          new = old + "    pub const VIEW_MODEL_COMPONENT_NAME: u16 = 557;\n"
          if text.count(old) != 1 or "VIEW_MODEL_COMPONENT_NAME" in text:
              raise SystemExit("core property-key insertion point changed")
          text = text.replace(old, new, 1)
          old = "        property_keys::COMPONENT_NAME\n        | property_keys::ANIMATION_NAME\n"
          new = "        property_keys::COMPONENT_NAME\n        | property_keys::VIEW_MODEL_COMPONENT_NAME\n        | property_keys::ANIMATION_NAME\n"
          if text.count(old) != 1:
              raise SystemExit("core string backing registry changed")
          core.write_text(text.replace(old, new, 1))

          binding = Path("src/objects/data_binding.rs")
          text = binding.read_text()
          view_model_old = '''    fn properties(&self) -> Vec<Property> {
        vec![
            Property {
                key: property_keys::COMPONENT_NAME,
                value: PropertyValue::String(self.name.clone()),
            },
            Property {
                key: property_keys::COMPONENT_PARENT_ID,
                value: PropertyValue::UInt(self.parent_id),
            },
        ]
    }
}

pub struct ViewModelProperty {'''
          view_model_new = '''    fn properties(&self) -> Vec<Property> {
        vec![Property {
            key: property_keys::VIEW_MODEL_COMPONENT_NAME,
            value: PropertyValue::String(self.name.clone()),
        }]
    }
}

pub struct ViewModelProperty {'''
          if text.count(view_model_old) != 1:
              raise SystemExit("ViewModel property encoding shape changed")
          text = text.replace(view_model_old, view_model_new, 1)

          bool_old = '''impl RiveObject for ViewModelPropertyBoolean {
    fn type_key(&self) -> u16 {
        type_keys::VIEW_MODEL_PROPERTY_BOOLEAN
    }
    fn properties(&self) -> Vec<Property> {
        vec![
            Property {
                key: property_keys::COMPONENT_NAME,
                value: PropertyValue::String(self.name.clone()),
            },
            Property {
                key: property_keys::COMPONENT_PARENT_ID,
                value: PropertyValue::UInt(self.parent_id),
            },
        ]
    }
}
'''
          bool_new = '''impl RiveObject for ViewModelPropertyBoolean {
    fn type_key(&self) -> u16 {
        type_keys::VIEW_MODEL_PROPERTY_BOOLEAN
    }
    fn properties(&self) -> Vec<Property> {
        vec![Property {
            key: property_keys::VIEW_MODEL_COMPONENT_NAME,
            value: PropertyValue::String(self.name.clone()),
        }]
    }
}
'''
          if text.count(bool_old) != 1:
              raise SystemExit("ViewModelPropertyBoolean encoding shape changed")
          binding.write_text(text.replace(bool_old, bool_new, 1))
          PY
          cargo fmt --all
      - name: Run focused contracts
        run: |
          cargo test --test authoring_behavior_contract --locked
          cargo test encoder::toc::tests::test_data_bind_context_source_path_has_string_backing --locked
          cargo run --quiet -- authoring compile examples/authoring/behavior-binding.v0.json -o target/issue179-behavior.riv
      - name: Commit fix
        shell: bash
        run: |
          git rm -f .github/workflows/issue-179-viewmodel-name-fix.yml scripts/issue179_viewmodel_name_fix_trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/objects/core.rs src/objects/data_binding.rs
          git commit -m "fix(builder): encode view-model component names"
          git push
