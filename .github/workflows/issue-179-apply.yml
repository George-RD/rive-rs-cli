name: Issue 179 branch patch

on:
  push:
    branches:
      - issue-179-typed-behavior
    paths:
      - scripts/issue179_trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused builder patch
        run: python scripts/issue179_builder_patch.py
      - name: Format
        run: cargo fmt --all
      - name: Focused builder check
        run: cargo test --lib builder:: --quiet
      - name: Commit branch changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "feat(builder): support view-model-bound bool inputs"
          git push
