name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  verify-font-assets:
    if: github.event.pull_request.head.ref == 'agent/font-asset-v0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/font-asset-v0
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply Clippy fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/authoring/lower.rs")
          text = path.read_text()
          old = "\n".join([
              "        if is_file_asset {",
              "            if let Some(object) = child.as_object_mut() {",
              '                object.remove("source");',
              "            }",
              "        }",
          ])
          new = "\n".join([
              "        if is_file_asset && let Some(object) = child.as_object_mut() {",
              '            object.remove("source");',
              "        }",
          ])
          if new in text:
              raise SystemExit(0)
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one collapsible-if replacement, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: cargo fmt
      - name: Preserve Clippy fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authoring/lower.rs
          git commit -m "fix: satisfy font asset validation lint"
          git push origin HEAD:agent/font-asset-v0
      - name: Verify focused contract
        run: cargo test --locked --test authoring_font_asset_contract
      - name: Verify Rust suite
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
      - name: Verify Cairn graph
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cairn scan
          cairn lint
      - name: Preserve Cairn evidence
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add map.json
          git commit -m "chore: refresh Cairn architecture map"
          git push origin HEAD:agent/font-asset-v0
