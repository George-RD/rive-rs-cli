name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  implement-font-assets:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/font-asset-v0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/font-asset-v0
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply font asset implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new, 1))

          spec = Path("src/authoring/spec.rs")
          if "pub font_assets: BTreeMap<String, String>" in spec.read_text():
              raise SystemExit(0)

          replace_once(
              "src/authoring/spec.rs",
              '''    pub artboard: AuthoringArtboard,
              #[serde(default)]
              pub parameters: BTreeMap<String, Quantity>,''',
              '''    pub artboard: AuthoringArtboard,
              #[serde(default)]
              pub font_assets: BTreeMap<String, String>,
              #[serde(default)]
              pub parameters: BTreeMap<String, Quantity>,''',
          )

          replace_once(
              "src/authoring/visual.rs",
              '''        id: String,
              text: String,
              font_size: ScalarExpr,''',
              '''        id: String,
              text: String,
              #[serde(default)]
              font: Option<String>,
              font_size: ScalarExpr,''',
          )
          replace_once(
              "src/authoring/visual.rs",
              '''pub(crate) struct TextNodeRef<'a> {
              pub content: &'a str,
              pub font_size: &'a ScalarExpr,''',
              '''pub(crate) struct TextNodeRef<'a> {
              pub content: &'a str,
              pub font: Option<&'a str>,
              pub font_size: &'a ScalarExpr,''',
          )
          replace_once(
              "src/authoring/visual.rs",
              '''            Self::Text {
              text,
              font_size,''',
              '''            Self::Text {
              text,
              font,
              font_size,''',
          )
          replace_once(
              "src/authoring/visual.rs",
              '''            } => Some(TextNodeRef {
              content: text,
              font_size,''',
              '''            } => Some(TextNodeRef {
              content: text,
              font: font.as_deref(),
              font_size,''',
          )

          replace_once(
              "src/authoring/frontend.rs",
              '''    validate_id(&spec.artboard.id, "$.artboard.id", &mut diagnostics);
              validate_parameter_names(&spec.parameters, "$.parameters", &mut diagnostics);''',
              '''    validate_id(&spec.artboard.id, "$.artboard.id", &mut diagnostics);
              validate_font_assets(&spec.font_assets, &mut diagnostics);
              validate_parameter_names(&spec.parameters, "$.parameters", &mut diagnostics);''',
          )
          replace_once(
              "src/authoring/frontend.rs",
              '''fn validate_parameter_names(
              parameters: &BTreeMap<String, Quantity>,
              path: &str,
              diagnostics: &mut Vec<AuthoringDiagnostic>,
          ) {''',
              '''fn validate_font_assets(
              font_assets: &BTreeMap<String, String>,
              diagnostics: &mut Vec<AuthoringDiagnostic>,
          ) {
              for (id, source) in font_assets {
                  if !is_authored_map_key(id) {
                      diagnostics.push(AuthoringDiagnostic::new(
                          "$.font_assets",
                          "invalid_asset_id",
                          format!(
                              "font asset id '{id}' must contain only ASCII letters, digits, '_' or '-'"
                          ),
                      ));
                  }
                  if source.trim().is_empty() {
                      diagnostics.push(AuthoringDiagnostic::new(
                          format!("$.font_assets.{id}"),
                          "invalid_asset_source",
                          "font asset source must not be empty",
                      ));
                  }
              }
          }

          fn validate_parameter_names(
              parameters: &BTreeMap<String, Quantity>,
              path: &str,
              diagnostics: &mut Vec<AuthoringDiagnostic>,
          ) {''',
          )
          replace_once(
              "src/authoring/frontend.rs",
              "        if !is_parameter_name(name) {",
              "        if !is_authored_map_key(name) {",
          )
          replace_once(
              "src/authoring/frontend.rs",
              "fn is_parameter_name(name: &str) -> bool {",
              "fn is_authored_map_key(name: &str) -> bool {",
          )
          replace_once(
              "src/authoring/frontend.rs",
              '''            },
              parameters: BTreeMap::new(),''',
              '''            },
              font_assets: spec.font_assets.clone(),
              parameters: BTreeMap::new(),''',
          )

          replace_once(
              "src/authoring/lower.rs",
              '''        let mut children = Vec::with_capacity(self.spec.visual.nodes.len());
              let mut component_stack = Vec::new();''',
              '''        let mut children =
              Vec::with_capacity(self.spec.font_assets.len() + self.spec.visual.nodes.len());
              for (index, (id, source)) in self.spec.font_assets.iter().enumerate() {
                  let runtime_name = font_asset_runtime_name(&self.spec.artboard.id, id);
                  let authored_path = format!("$.font_assets.{id}");
                  self.register_runtime_names(std::slice::from_ref(&runtime_name), &authored_path)
                      .map_err(AuthoringError::one)?;
                  self.source_map.entries.push(SourceMapEntry {
                      authored_id: id.clone(),
                      authored_path,
                      definition_path: None,
                      runtime_names: vec![runtime_name.clone()],
                      scene_paths: vec![format!("/artboard/children/{index}")],
                  });
                  children.push(json!({
                      "type": "font_asset",
                      "name": runtime_name,
                      "source": source
                  }));
              }
              let visual_offset = children.len();
              let mut component_stack = Vec::new();''',
          )
          replace_once(
              "src/authoring/lower.rs",
              '''            let scene_path = format!("/artboard/children/{index}");''',
              '''            let scene_path = format!("/artboard/children/{}", visual_offset + index);''',
          )
          replace_once(
              "src/authoring/lower.rs",
              '''        let scene_spec = serde_json::from_value::<SceneSpec>(scene.clone()).map_err(|error| {''',
              '''        let validation_scene = without_asset_sources(&scene);
              let scene_spec = serde_json::from_value::<SceneSpec>(validation_scene).map_err(|error| {''',
          )
          replace_once(
              "src/authoring/lower.rs",
              '''fn runtime_name(segments: &[String], role: &str) -> String {''',
              '''fn font_asset_runtime_name(artboard_id: &str, asset_id: &str) -> String {
              runtime_name(
                  &[artboard_id.to_string(), asset_id.to_string()],
                  "font_asset",
              )
          }

          fn without_asset_sources(scene: &Value) -> Value {
              let mut validation_scene = scene.clone();
              let Some(children) = validation_scene
                  .pointer_mut("/artboard/children")
                  .and_then(Value::as_array_mut)
              else {
                  return validation_scene;
              };
              for child in children {
                  let is_file_asset = matches!(
                      child.get("type").and_then(Value::as_str),
                      Some("font_asset" | "image_asset")
                  );
                  if is_file_asset {
                      if let Some(object) = child.as_object_mut() {
                          object.remove("source");
                      }
                  }
              }
              validation_scene
          }

          fn runtime_name(segments: &[String], role: &str) -> String {''',
          )

          replace_once(
              "src/authoring/lower/text.rs",
              '''    LoweredObject, Lowerer, NodeContext, PaintTarget, evaluate_ratio_expression, runtime_name,
          };''',
              '''    LoweredObject, Lowerer, NodeContext, PaintTarget, evaluate_ratio_expression,
              font_asset_runtime_name, runtime_name,
          };''',
          )
          replace_once(
              "src/authoring/lower/text.rs",
              '''            content,
              font_size: font_size_expression,''',
              '''            content,
              font,
              font_size: font_size_expression,''',
          )
          replace_once(
              "src/authoring/lower/text.rs",
              '''            scope,
              } = context;

              let font_size = evaluate_expression(''',
              '''            scope,
              } = context;

              let font_asset = font
                  .map(|id| {
                      if !self.spec.font_assets.contains_key(id) {
                          return Err(AuthoringDiagnostic::new(
                              format!("{authored_path}.font"),
                              "unknown_font_asset",
                              format!("font asset '{id}' is not declared"),
                          ));
                      }
                      Ok(font_asset_runtime_name(&self.spec.artboard.id, id))
                  })
                  .transpose()?;

              let font_size = evaluate_expression(''',
          )
          replace_once(
              "src/authoring/lower/text.rs",
              '''        if let Some(object) = style.as_object_mut() {
              if let Some(line_height) = line_height {''',
              '''        if let Some(object) = style.as_object_mut() {
              if let Some(font_asset) = font_asset {
                  object.insert("font_asset".to_string(), Value::String(font_asset));
              }
              if let Some(line_height) = line_height {''',
          )

          replace_once(
              "tests/authoring_contract.rs",
              '''#[test]
          fn published_authoring_schema_matches_generated_contract() {
              let schema_path = Path::new(env!("CARGO_MANIFEST_DIR")).join("docs/authoring.schema.v0.json");
              let published: serde_json::Value = serde_json::from_str(
                  &fs::read_to_string(&schema_path).expect("read published authoring schema"),
              )
              .expect("published authoring schema must be valid JSON");
              let generated = authoring_schema();

              assert_eq!(
                  published,
                  generated,
                  "published authoring schema differs from authoring_schema(); regenerate {}",
                  schema_path.display()
              );
          }''',
              '''#[test]
          fn published_authoring_schema_matches_generated_contract() {
              let schema_path = Path::new(env!("CARGO_MANIFEST_DIR")).join("docs/authoring.schema.v0.json");
              let generated = authoring_schema();
              if std::env::var_os("UPDATE_AUTHORING_SCHEMA").is_some() {
                  fs::write(
                      &schema_path,
                      format!(
                          "{}\\n",
                          serde_json::to_string_pretty(&generated)
                              .expect("serialize generated authoring schema")
                      ),
                  )
                  .expect("write published authoring schema");
                  return;
              }
              let published: serde_json::Value = serde_json::from_str(
                  &fs::read_to_string(&schema_path).expect("read published authoring schema"),
              )
              .expect("published authoring schema must be valid JSON");

              assert_eq!(
                  published,
                  generated,
                  "published authoring schema differs from authoring_schema(); regenerate {}",
                  schema_path.display()
              );
          }''',
          )
          PY
      - run: cargo fmt
      - name: Regenerate AuthoringSpec schema
        run: UPDATE_AUTHORING_SCHEMA=1 cargo test --test authoring_contract published_authoring_schema_matches_generated_contract -- --exact
      - name: Verify focused font asset contract
        run: cargo test --locked --test authoring_font_asset_contract
      - name: Verify Rust suite
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
      - name: Verify Cairn graph
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cairn scan
          cairn lint
      - name: Commit GREEN implementation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authoring tests/authoring_contract.rs docs/authoring.schema.v0.json map.json
          git commit -m "feat: add semantic font assets to authoring"
          git push origin HEAD:agent/font-asset-v0

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - name: Run Clippy
        id: clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clippy-diagnostics
          path: clippy.log
          retention-days: 1
      - name: Fail when Clippy failed
        if: steps.clippy.outcome == 'failure'
        run: exit 1
      - name: Run Rust tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --locked --all-features 2>&1 | tee rust-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-test-diagnostics
          path: rust-tests.log
          retention-days: 1
      - name: Fail when Rust tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  browser-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/playwright/shared-contract.js
      - run: node tests/playwright/visual-contract.js

  runtime-eval-evidence:
    needs: [check, browser-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - name: Run official-runtime evaluation suite
        run: |
          set -o pipefail
          cargo run --quiet -- ai lab \
            --suite evals/suites/runtime_contract.v1.json \
            --provider template \
            --output-dir target/eval-runtime 2>&1 | tee runtime-eval.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-eval-evidence
          path: |
            runtime-eval.log
            target/eval-runtime
          retention-days: 7

  architecture:
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
      - name: Validate architecture graph
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          set -o pipefail
          cairn scan --json | tee cairn-scan.json
          cairn lint --json | tee cairn-lint.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cairn-diagnostics
          path: |
            cairn-scan.json
            cairn-lint.json
          retention-days: 7

  playwright:
    needs: [check, browser-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo build
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/playwright/regression.js
      - name: Run visual regression
        id: visual
        continue-on-error: true
        run: |
          set -o pipefail
          node tests/playwright/visual-regression.js 2>&1 | tee visual-regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-diagnostics
          path: |
            visual-regression.log
            target/playwright-visual
          retention-days: 1
      - name: Fail when visual regression failed
        if: steps.visual.outcome == 'failure'
        run: exit 1

  demo:
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo build
      - run: npm install --no-save playwright@1.62.0 wait-on@8.0.1
      - run: npx playwright install --with-deps chromium
      - name: Run demo validation
        run: |
          node demo/serve.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          npx wait-on http://localhost:3021 --timeout 300000
          node tests/playwright/demo-validation.js

  site:
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/playwright/site-validation.js
