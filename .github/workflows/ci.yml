name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  persist-source-cleanup:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Consolidate authoring helpers
        run: |
          python - <<'PY'
          from pathlib import Path

          lower = Path("src/authoring/lower.rs")
          text = lower.read_text()
          old = "\nfn runtime_name(segments: &[String], role: &str) -> String {"
          new = "\npub(super) fn runtime_name(segments: &[String], role: &str) -> String {"
          if old in text:
              text = text.replace(old, new, 1)
              lower.write_text(text)
          elif new not in text:
              raise SystemExit("runtime_name helper signature not found")

          module = Path("src/authoring/mod.rs")
          text = module.read_text()
          old = "    MotionSection, PaintSpec, Quantity, RawSceneFragment, ScalarExpr, SourceMapEntry, StrokeSpec,\n    TransformSpec, Unit, VisualSection,\n"
          new = "    MotionInterpolation, MotionLoop, MotionSection, MotionTrackSpec, PaintSpec, PoseKeyframeSpec,\n    PoseSpec, PoseTargetSpec, Quantity, RawSceneFragment, ScalarExpr, SourceMapEntry, StrokeSpec,\n    TransformSpec, Unit, VisualSection,\n"
          if old in text:
              text = text.replace(old, new, 1)
              module.write_text(text)
          elif new not in text:
              raise SystemExit("authoring re-export block not found")

          motion = Path("src/authoring/frontend/motion.rs")
          text = motion.read_text()
          old = '                "name": animation_runtime_name(&spec.artboard.id, &track.id),\n'
          new = '                "name": lower::runtime_name(\n                    &[spec.artboard.id.clone(), track.id.clone()],\n                    "animation",\n                ),\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("motion runtime-name call not found")
          marker = "\nfn animation_runtime_name(artboard_id: &str, track_id: &str) -> String {"
          if marker in text:
              text = text[: text.index(marker)].rstrip() + "\n"
          motion.write_text(text)

          validation = Path("src/authoring/frontend/motion/validation.rs")
          text = validation.read_text()
          import_line = "use super::super::validate_id;\n"
          if import_line not in text:
              text = text.replace(
                  "use std::collections::HashSet;\n\n",
                  "use std::collections::HashSet;\n\nuse super::super::validate_id;\n",
                  1,
              )
          marker = "\nfn validate_id(id: &str, path: &str, diagnostics: &mut Vec<AuthoringDiagnostic>) {"
          if marker in text:
              text = text[: text.index(marker)].rstrip() + "\n"
          validation.write_text(text)
          PY
          cargo fmt
      - name: Commit source cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authoring
          git commit -m "refactor(authoring): consolidate motion helpers"
          git push origin "HEAD:${{ github.head_ref }}"

  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - name: Run Clippy
        id: clippy
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clippy-diagnostics
          path: clippy.log
          retention-days: 1
      - name: Fail when Clippy failed
        if: steps.clippy.outcome == 'failure'
        run: exit 1
      - name: Run Rust tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --locked --all-features 2>&1 | tee rust-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-test-diagnostics
          path: rust-tests.log
          retention-days: 1
      - name: Fail when Rust tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  browser-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/playwright/shared-contract.js
      - run: node tests/playwright/visual-contract.js

  runtime-eval-evidence:
    needs: [check, browser-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - name: Run official-runtime evaluation suite
        run: |
          set -o pipefail
          cargo run --quiet -- ai lab \
            --suite evals/suites/runtime_contract.v1.json \
            --provider template \
            --output-dir target/eval-runtime 2>&1 | tee runtime-eval.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-eval-evidence
          path: |
            runtime-eval.log
            target/eval-runtime
          retention-days: 7

  architecture:
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
      - name: Validate architecture graph
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          set -o pipefail
          cairn scan --json | tee cairn-scan.json
          cairn lint --json | tee cairn-lint.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cairn-diagnostics
          path: |
            cairn-scan.json
            cairn-lint.json
          retention-days: 7

  playwright:
    needs: [check, browser-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo build
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/playwright/regression.js
      - name: Run visual regression
        id: visual
        continue-on-error: true
        run: |
          set -o pipefail
          node tests/playwright/visual-regression.js 2>&1 | tee visual-regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression-diagnostics
          path: |
            visual-regression.log
            target/playwright-visual
          retention-days: 1
      - name: Fail when visual regression failed
        if: steps.visual.outcome == 'failure'
        run: exit 1

  demo:
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo build
      - run: npm install --no-save playwright@1.62.0 wait-on@8.0.1
      - run: npx playwright install --with-deps chromium
      - name: Run demo validation
        run: |
          node demo/serve.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          npx wait-on http://localhost:3021 --timeout 300000
          node tests/playwright/demo-validation.js

  site:
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/playwright/site-validation.js