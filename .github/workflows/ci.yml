name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  address-review:
    if: github.event.pull_request.head.ref == 'agent/font-asset-v0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/font-asset-v0
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Preserve raw asset source type validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/authoring/lower.rs")
          text = path.read_text()
          old = "\n".join([
              "        if is_file_asset && let Some(object) = child.as_object_mut() {",
              '            object.remove("source");',
              "        }",
          ])
          new = "\n".join([
              '        let has_string_source = child.get("source").is_some_and(Value::is_string);',
              "        if is_file_asset",
              "            && has_string_source",
              "            && let Some(object) = child.as_object_mut()",
              "        {",
              '            object.remove("source");',
              "        }",
          ])
          if new not in text:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one source-stripping replacement, found {count}")
              path.write_text(text.replace(old, new, 1))

          contract = Path("tests/authoring_contract.rs")
          text = contract.read_text()
          old = "\n".join([
              '    let published: serde_json::Value = serde_json::from_str(',
              '        &fs::read_to_string(&schema_path).expect("read published authoring schema"),',
              "    )",
              '    .expect("published authoring schema must be valid JSON");',
              "    let generated = authoring_schema();",
              '    if std::env::var_os("UPDATE_AUTHORING_SCHEMA").is_some() {',
          ])
          new = "\n".join([
              "    let generated = authoring_schema();",
              '    if std::env::var_os("UPDATE_AUTHORING_SCHEMA").is_some() {',
          ])
          if old in text:
              text = text.replace(old, new, 1)
              anchor = "\n".join([
                  "        return;",
                  "    }",
                  "",
                  "    assert_eq!(",
              ])
              replacement = "\n".join([
                  "        return;",
                  "    }",
                  "    let published: serde_json::Value = serde_json::from_str(",
                  '        &fs::read_to_string(&schema_path).expect("read published authoring schema"),',
                  "    )",
                  '    .expect("published authoring schema must be valid JSON");',
                  "",
                  "    assert_eq!(",
              ])
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f"expected one schema assertion anchor, found {count}")
              contract.write_text(text.replace(anchor, replacement, 1))
          PY
      - run: cargo fmt
      - name: Verify focused review regression
        run: cargo test --locked --test authoring_validation_contract raw_file_asset_sources_keep_canonical_type_validation -- --exact
      - name: Verify Rust suite
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
      - name: Verify Cairn graph
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cairn scan
          cairn lint
      - name: Commit review fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authoring/lower.rs tests/authoring_contract.rs map.json
          git commit -m "fix: preserve raw asset source validation"
          git push origin HEAD:agent/font-asset-v0
