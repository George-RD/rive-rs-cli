name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  playwright:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo build
      - run: npm install --no-save playwright@1.50.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/playwright/regression.js

  demo:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo build
      - run: npm install --no-save playwright@1.50.1 wait-on@8.0.1
      - run: npx playwright install --with-deps chromium
      - name: Run demo validation
        run: |
          node demo/serve.js &
          SERVER_PID=$!
          npx wait-on http://localhost:3021 --timeout 60000
          node tests/playwright/demo-validation.js
          kill $SERVER_PID
