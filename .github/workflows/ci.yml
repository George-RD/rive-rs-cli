name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cairn-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format Rust sources
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          cargo fmt --all 2>&1 | tee rustfmt.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustfmt-diagnostics
          path: rustfmt.log
          retention-days: 1
      - name: Persist formatting
        if: steps.format.outcome == 'success'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style: format foundation refactor"
            git push origin HEAD:agent/cairn-foundation
          fi
      - name: Fail when rustfmt failed
        if: steps.format.outcome == 'failure'
        run: exit 1
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  playwright:
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cairn-foundation
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo build
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/playwright/regression.js
      - run: node tests/playwright/visual-regression.js

  demo:
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cairn-foundation
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo build
      - run: npm install --no-save playwright@1.62.0 wait-on@8.0.1
      - run: npx playwright install --with-deps chromium
      - name: Run demo validation
        run: |
          node demo/serve.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          npx wait-on http://localhost:3021 --timeout 300000
          node tests/playwright/demo-validation.js

  site:
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cairn-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/playwright/site-validation.js
