name: Fix constraint wording

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/simple-constraints-v0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simple-constraints-v0
      - name: Correct spacing semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/authoring-spec-v0.md')
          text = path.read_text()
          old = "places each later item one pixel gap after the previous item"
          new = "places each later item the evaluated pixel gap after the previous item"
          if old not in text:
              raise SystemExit('spacing wording marker is missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit wording correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/authoring-spec-v0.md
          git commit -m "Clarify constraint spacing semantics"
          git push
