name: Apply authored trim-path patch from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/authoring-trim-path-v0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authoring-trim-path-v0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply implementation
        run: python3 scripts/agent_apply_trim_path.py
      - name: Format and verify focused contract
        run: |
          cargo fmt --all
          cargo test --locked --all-features --test authoring_trim_path_contract
      - name: Regenerate authoring schema
        run: |
          cat > examples/_dump_authoring_schema.rs <<'RS'
          fn main() {
              let schema = rive_cli::authoring::authoring_schema();
              println!(
                  "{}",
                  serde_json::to_string_pretty(&schema).expect("serialize authoring schema")
              );
          }
          RS
          cargo run --quiet --example _dump_authoring_schema > docs/authoring.schema.v0.json
          rm examples/_dump_authoring_schema.rs
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authoring/spec.rs src/authoring/lower.rs src/authoring/frontend.rs \
            docs/authoring-spec-v0.md docs/authoring.schema.v0.json \
            meta/todos/todo.visual-authoring-compiler.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: lower authored trim paths"
          git push origin HEAD:agent/authoring-trim-path-v0
