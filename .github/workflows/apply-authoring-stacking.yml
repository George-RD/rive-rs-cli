name: Apply AuthoringSpec Stacking

on:
  push:
    branches:
      - agent/authoring-stacking-order

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authoring-stacking-order
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('.github/apply-authoring-stacking.py')
          script = script_path.read_text()
          strict = '''    if old not in text:
                  raise SystemExit(f"replacement target not found: {path}")
              target.write_text(text.replace(old, new, 1))
          '''
          idempotent = '''    if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"replacement target not found: {path}")
              target.write_text(text.replace(old, new, 1))
          '''
          if strict not in script:
              raise SystemExit('replace helper not found')
          script_path.write_text(script.replace(strict, idempotent, 1))

          frontend_path = Path('src/authoring/frontend.rs')
          frontend = frontend_path.read_text()
          before = '            visual: VisualSection {\n                nodes: vec![VisualNode::Instance {\n'
          after = '            visual: VisualSection {\n                stacking: Default::default(),\n                nodes: vec![VisualNode::Instance {\n'
          if before in frontend:
              frontend_path.write_text(frontend.replace(before, after, 1))
          elif after not in frontend:
              raise SystemExit('VisualSection validation literal not found')
          PY
          python3 .github/apply-authoring-stacking.py
      - name: Format, refresh schema, and prove the compiler contract
        run: |
          cargo fmt --all
          UPDATE_AUTHORING_SCHEMA=1 cargo test --locked authoring_schema_file_is_in_sync
          cargo test --locked --test authoring_stacking_contract
          git diff --check
      - name: Commit generated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!.github/apply-authoring-stacking.py' ':!.github/workflows/apply-authoring-stacking.yml'
          git commit -m "feat: add explicit AuthoringSpec stacking"
          git push origin HEAD:agent/authoring-stacking-order
