name: Stage motion dimensions

on:
  push:
    branches: [agent/motion-dimensions]

permissions:
  contents: write

jobs:
  red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact test-only head without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin 46b9b589873181ad6974368b0533bc532d26a0fc
          git checkout --detach FETCH_HEAD
      - name: Prepare Rust toolchain
        run: |
          rustup default stable
          rustup component add clippy rustfmt
      - name: Prove the dimension contract is RED
        run: |
          set +e
          set -o pipefail
          cargo test --test authoring_motion_dimension_contract 2>&1 | tee /tmp/motion-dimensions-red.log
          test_status=${PIPESTATUS[0]}
          set -e
          test "$test_status" -ne 0
          grep -F "test result: FAILED. 0 passed; 4 failed" /tmp/motion-dimensions-red.log

  stage:
    if: github.actor != 'github-actions[bot]'
    needs: red
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin agent/motion-dimensions
          git checkout -B agent/motion-dimensions FETCH_HEAD
      - name: Prepare Rust toolchain
        run: |
          rustup default stable
          rustup component add clippy rustfmt
      - name: Apply focused implementation
        run: python3 scripts/stage_motion_dimensions.py
      - name: Format and regenerate schema
        run: |
          cargo fmt
          cargo test --test authoring_contract regenerate_published_authoring_schema -- --ignored
      - name: Verify Rust contracts
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Remove staging-only files
        run: |
          rm scripts/stage_motion_dimensions.py
          rm .github/workflows/stage-motion-dimensions.yml
      - name: Commit verified implementation
        run: |
          git diff --check
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(authoring): add typed motion dimensions"
          echo "IMPLEMENTATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Record durable Cairn evidence
        env:
          RED_SHA: 46b9b589873181ad6974368b0533bc532d26a0fc
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("meta/todos/todo.motion-authoring-compiler.md")
          text = path.read_text()
          marker = "\n## Remaining\n"
          if marker not in text:
              raise SystemExit("motion todo remaining marker not found")
          section = f"""

The typed shape-dimension continuation remains within this P2 todo:

- exact-head RED `{os.environ['RED_SHA']}` in branch workflow run `{os.environ['GITHUB_RUN_ID']}` proves the four focused contracts fail before implementation;
- pose targets may declare positive pixel-valued `width` and `height` expressions;
- transform properties remain on the authored shape object while dimensions select its first compatible parametric geometry object through the canonical builder property registry;
- mixed-property poses retain deterministic keyframe ordering, authored-path diagnostics, schema exposure, canonical builder acceptance, and source-map ownership without encoder-side logic;
- verified implementation `{os.environ['IMPLEMENTATION_SHA']}` passed rustfmt, Clippy, the complete Rust suite, and generated-schema reconciliation before this durable evidence was committed.
"""
          path.write_text(text.replace(marker, section + marker, 1))
          PY
      - name: Reconcile Cairn graph
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          set -o pipefail
          cairn scan --json | tee /tmp/cairn-scan.json
          cairn lint --json | tee /tmp/cairn-lint.json
      - name: Commit evidence and push
        run: |
          git diff --check
          git add -A
          git commit -m "docs(cairn): record motion dimension evidence"
          git push origin HEAD:agent/motion-dimensions
