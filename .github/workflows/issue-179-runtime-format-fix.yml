name: Issue 179 runtime format fix

on:
  push:
    branches: [issue-179-typed-behavior]
    paths: [scripts/issue179_runtime_format_fix_trigger]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Align view-model encoding and binding IDs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          core = "src/objects/core.rs"
          replace_once(
              core,
              "    pub const COMPONENT_PARENT_ID: u16 = 5;\n",
              "    pub const COMPONENT_PARENT_ID: u16 = 5;\n    pub const VIEW_MODEL_COMPONENT_NAME: u16 = 557;\n",
          )
          replace_once(
              core,
              "        property_keys::COMPONENT_NAME\n        | property_keys::ANIMATION_NAME\n",
              "        property_keys::COMPONENT_NAME\n        | property_keys::VIEW_MODEL_COMPONENT_NAME\n        | property_keys::ANIMATION_NAME\n",
          )

          binding = "src/objects/data_binding.rs"
          replace_once(
              binding,
              '''    fn properties(&self) -> Vec<Property> {\n        vec![\n            Property {\n                key: property_keys::COMPONENT_NAME,\n                value: PropertyValue::String(self.name.clone()),\n            },\n            Property {\n                key: property_keys::COMPONENT_PARENT_ID,\n                value: PropertyValue::UInt(self.parent_id),\n            },\n        ]\n    }\n}\n\npub struct ViewModelProperty {''',
              '''    fn properties(&self) -> Vec<Property> {\n        vec![Property {\n            key: property_keys::VIEW_MODEL_COMPONENT_NAME,\n            value: PropertyValue::String(self.name.clone()),\n        }]\n    }\n}\n\npub struct ViewModelProperty {''',
          )
          replace_once(
              binding,
              '''impl RiveObject for ViewModelPropertyBoolean {\n    fn type_key(&self) -> u16 {\n        type_keys::VIEW_MODEL_PROPERTY_BOOLEAN\n    }\n    fn properties(&self) -> Vec<Property> {\n        vec![\n            Property {\n                key: property_keys::COMPONENT_NAME,\n                value: PropertyValue::String(self.name.clone()),\n            },\n            Property {\n                key: property_keys::COMPONENT_PARENT_ID,\n                value: PropertyValue::UInt(self.parent_id),\n            },\n        ]\n    }\n}\n''',
              '''impl RiveObject for ViewModelPropertyBoolean {\n    fn type_key(&self) -> u16 {\n        type_keys::VIEW_MODEL_PROPERTY_BOOLEAN\n    }\n    fn properties(&self) -> Vec<Property> {\n        vec![Property {\n            key: property_keys::VIEW_MODEL_COMPONENT_NAME,\n            value: PropertyValue::String(self.name.clone()),\n        }]\n    }\n}\n''',
          )

          sm = Path("src/builder/state_machines.rs")
          text = sm.read_text()
          text = text.replace(
              '''    BlendState1DChildSpec, BlendStateChildSpec, BlendStateDirectChildSpec, InputSpec,\n    ListenerActionSpec, StateMachineComponentSpec, StateMachineSpec, StateSpec,\n''',
              '''    BlendState1DChildSpec, BlendStateChildSpec, BlendStateDirectChildSpec, InputSpec,\n    ListenerActionSpec, ObjectSpec, StateMachineComponentSpec, StateMachineSpec, StateSpec,\n''',
              1,
          )
          marker = '''/// Builds all state machine objects for an artboard.\npub(crate) fn build_state_machines(\n'''
          helper = r'''fn view_model_property_name(object: &ObjectSpec) -> Option<&str> {
    match object {
        ObjectSpec::ViewModelProperty { name, .. }
        | ObjectSpec::ViewModelPropertyNumber { name, .. }
        | ObjectSpec::ViewModelPropertyBoolean { name, .. }
        | ObjectSpec::ViewModelPropertyString { name, .. }
        | ObjectSpec::ViewModelPropertyColor { name, .. }
        | ObjectSpec::ViewModelPropertyList { name, .. }
        | ObjectSpec::ViewModelPropertyViewModel { name, .. }
        | ObjectSpec::ViewModelPropertyEnum { name, .. }
        | ObjectSpec::ViewModelPropertyEnumCustom { name, .. }
        | ObjectSpec::ViewModelPropertyEnumSystem { name, .. }
        | ObjectSpec::ViewModelPropertyTrigger { name, .. }
        | ObjectSpec::ViewModelPropertyAssetImage { name, .. }
        | ObjectSpec::ViewModelPropertyArtboard { name, .. }
        | ObjectSpec::ViewModelPropertySymbol { name, .. }
        | ObjectSpec::ViewModelPropertySymbolListIndex { name, .. } => Some(name),
        _ => None,
    }
}

fn resolve_view_model_binding_ids(
    artboard_children: &[ObjectSpec],
    view_model_id_base: u64,
    view_model_name: &str,
    property_name: &str,
) -> Option<(u64, u64)> {
    let mut view_model_id = view_model_id_base;
    for child in artboard_children {
        let ObjectSpec::ViewModel { name, children } = child else {
            continue;
        };
        if name == view_model_name {
            let mut property_id = 0u64;
            for property in children.as_deref().unwrap_or_default() {
                if let Some(name) = view_model_property_name(property) {
                    if name == property_name {
                        return Some((view_model_id, property_id));
                    }
                    property_id += 1;
                }
            }
            return None;
        }
        view_model_id += 1;
    }
    None
}

/// Builds all state machine objects for an artboard.
pub(crate) fn build_state_machines(
'''
          if text.count(marker) != 1:
              raise SystemExit("state machine helper insertion point changed")
          text = text.replace(marker, helper, 1)
          text = text.replace(
              '''    object_name_to_index: &HashMap<String, usize>,\n    animation_name_to_index: &HashMap<String, usize>,\n) -> Result<(), String> {''',
              '''    object_name_to_index: &HashMap<String, usize>,\n    animation_name_to_index: &HashMap<String, usize>,\n    artboard_children: &[ObjectSpec],\n    view_model_id_base: u64,\n) -> Result<(), String> {''',
              1,
          )
          old = '''                            let view_model_global = *object_name_to_index\n                                .get(&binding.view_model)\n                                .ok_or_else(|| {\n                                    format!(\n                                        "unknown view model referenced by bool input '{}': '{}'",\n                                        name, binding.view_model\n                                    )\n                                })?;\n                            let property_global = *object_name_to_index\n                                .get(&binding.property)\n                                .ok_or_else(|| {\n                                    format!(\n                                        "unknown view-model property referenced by bool input '{}': '{}'",\n                                        name, binding.property\n                                    )\n                                })?;\n                            let view_model_id = view_model_global\n                                .checked_sub(artboard_start)\n                                .ok_or_else(|| {\n                                    format!(\n                                        "view model '{}' precedes current artboard",\n                                        binding.view_model\n                                    )\n                                })? as u64;\n                            let property_id =\n                                property_global.checked_sub(artboard_start).ok_or_else(|| {\n                                    format!(\n                                        "view-model property '{}' precedes current artboard",\n                                        binding.property\n                                    )\n                                })? as u64;\n'''
          new = '''                            let (view_model_id, property_id) = resolve_view_model_binding_ids(\n                                artboard_children,\n                                view_model_id_base,\n                                &binding.view_model,\n                                &binding.property,\n                            )\n                            .ok_or_else(|| {\n                                format!(\n                                    "unknown view-model binding referenced by bool input '{}': '{}.{}'",\n                                    name, binding.view_model, binding.property\n                                )\n                            })?;\n'''
          if text.count(old) != 1:
              raise SystemExit("old bool binding resolution changed")
          sm.write_text(text.replace(old, new, 1))

          scene = Path("src/builder/scene.rs")
          text = scene.read_text()
          text = text.replace(
              '''    for artboard_spec in &artboard_specs {\n''',
              '''    let mut view_model_id_base = 0u64;\n    for artboard_spec in &artboard_specs {\n''',
              1,
          )
          old = '''                &object_name_to_index,\n                &animation_name_to_index,\n            )?;\n        }\n    }\n\n    Ok(objects)\n}'''
          new = '''                &object_name_to_index,\n                &animation_name_to_index,\n                &artboard_spec.children,\n                view_model_id_base,\n            )?;\n        }\n\n        view_model_id_base += artboard_spec\n            .children\n            .iter()\n            .filter(|child| matches!(child, ObjectSpec::ViewModel { .. }))\n            .count() as u64;\n    }\n\n    Ok(objects)\n}'''
          if text.count(old) != 1:
              raise SystemExit("build_state_machines call shape changed")
          scene.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Run focused contracts
        run: |
          cargo test --test authoring_behavior_contract --locked
          cargo test encoder::toc::tests::test_data_bind_context_source_path_has_string_backing --locked
          cargo run --quiet -- authoring compile examples/authoring/behavior-binding.v0.json -o target/issue179-behavior.riv
      - name: Commit fix
        shell: bash
        run: |
          git rm -f .github/workflows/issue-179-runtime-format-fix.yml scripts/issue179_runtime_format_fix_trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/objects/core.rs src/objects/data_binding.rs src/builder/state_machines.rs src/builder/scene.rs
          git commit -m "fix(builder): encode runtime view-model binding paths"
          git push
