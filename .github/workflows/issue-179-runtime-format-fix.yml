name: Issue 179 runtime format fix

on:
  push:
    branches:
      - issue-179-typed-behavior
    paths:
      - scripts/issue179_runtime_format_fix_trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply runtime-format patch
        run: python3 scripts/issue179_runtime_format_fix.py
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo test --test authoring_behavior_contract --locked
          cargo test encoder::toc::tests::test_data_bind_context_source_path_has_string_backing --locked
          cargo run --quiet -- authoring compile examples/authoring/behavior-binding.v0.json -o target/issue179-behavior.riv
      - name: Commit fix
        shell: bash
        run: |
          git rm -f .github/workflows/issue-179-runtime-format-fix.yml scripts/issue179_runtime_format_fix.py scripts/issue179_runtime_format_fix_trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/objects/core.rs src/objects/data_binding.rs src/builder/state_machines.rs src/builder/scene.rs
          git commit -m "fix(builder): align view-model bindings with runtime"
          git push
