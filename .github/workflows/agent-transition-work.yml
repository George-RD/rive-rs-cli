name: Transition duration workbench

on:
  push:
    branches: [agent/authoring-transition-duration]
    paths: [.github/workflows/agent-transition-work.yml]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply reviewed duration patch with exact Unreleased anchor
        run: |
          git show 5b5c3814169a6377caf78a99c1a20b779eb66c8b:.github/workflows/agent-transition-work.yml > /tmp/duration-patch.yml
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          text = Path('/tmp/duration-patch.yml').read_text()
          script = dedent(text.split("          python3 - <<'PY'\n", 1)[1].split('\n          PY\n', 1)[0])
          old = "replace('CHANGELOG.md', '### Added\\n',"
          assert script.count(old) == 1
          script = script.replace(old, "replace('CHANGELOG.md', '## [Unreleased]\\n\\n### Added\\n',")
          old = "'### Added\\n\\n- **Timed authored transitions.**"
          assert script.count(old) == 1
          script = script.replace(old, "'## [Unreleased]\\n\\n### Added\\n\\n- **Timed authored transitions.**")
          script = script.replace("'''function verifyCliTransitionDuration", "r'''function verifyCliTransitionDuration")
          exec(compile(script, 'reviewed-duration-patch', 'exec'))
          PY
      - run: cargo fmt
      - run: cargo fmt --check
      - run: cargo test --locked --test authoring_transition_duration_contract
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - run: node --check tests/playwright/authoring-behavior-runtime.js
      - run: node tests/playwright/authoring-behavior-runtime.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transition-duration-workbench-evidence
          path: target/playwright-behavior
          retention-days: 7
      - name: Commit verified contracts and documentation
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/authoring/frontend/compiler/behavior.rs tests/authoring_transition_duration_contract.rs tests/playwright/authoring-behavior-runtime.js docs/authoring-spec-v0.md ROADMAP.md meta/todos/todo.behavior-authoring-compiler.md CHANGELOG.md
          git commit -m 'test(authoring): verify timed blends through public CLI and document contract (#225)'
          git push origin HEAD:refs/heads/agent/authoring-transition-duration
