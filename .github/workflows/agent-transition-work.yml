name: Transition duration workbench

on:
  push:
    branches: [agent/authoring-transition-duration]
    paths: [.github/workflows/agent-transition-work.yml]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test authoring_transition_duration_contract
