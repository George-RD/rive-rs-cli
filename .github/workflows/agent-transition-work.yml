name: Transition duration workbench

on:
  push:
    branches: [agent/authoring-transition-duration]
    paths: [.github/workflows/agent-transition-work.yml]

permissions:
  contents: write

jobs:
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile authoring contract and example guidance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == 1, f"patch anchor mismatch: {path}"
              p.write_text(text.replace(old, new))

          contract = 'meta/contracts/authoring.md'
          replace(contract,
              'alongside a statechart. Additive blend states, direct blend states, transition duration\nand exit time, and view-model properties other than `bool` are not exposed by this\nfrontend. `stacking`, `continuity`, `waypoint`, `blend`, and `regions` are optional and',
              'alongside a statechart. Additive blend states, direct blend states, exit time, and\nview-model properties other than `bool` are not exposed by this frontend.\n`stacking`, `continuity`, `waypoint`, `blend`, `regions`, and `duration_ms` are optional and')
          replace(contract, 'A behavior state declares exactly one of `motion` and `blend`.',
              'A transition may declare `duration_ms` as a scalar expression evaluated in the\ndocument parameter scope. It must resolve to a finite whole number from 0 through\n`u32::MAX` milliseconds; negative, fractional, and oversized results return\n`invalid_transition_duration` at its authored `.duration_ms` path. Expression errors\nkeep their existing codes and paths. Region transitions follow the same rule. Only a\nsupplied duration emits canonical `duration`; omission preserves the previous scene\nand source map, and explicit zero preserves instantaneous binary behavior. Duration\ncontrols the blend after a condition fires, not an exit-time gate or percentage.\n\nA behavior state declares exactly one of `motion` and `blend`.')
          examples = 'examples/authoring/README.md'
          replace(examples,
              'transition duration and exit time, and view-model number or trigger properties',
              'exit time, and view-model number or trigger properties')
          replace(examples, '`stacking-card.v0.json` sets',
              'Transitions also accept optional `duration_ms` scalar expressions. The retained\n`tests/playwright/authoring-behavior-runtime.js` contract derives a 1000ms variant\nof `pointer-statechart.v0.json`, compiles it through the public CLI, and compares\nintermediate and final frames with the unchanged instantaneous fixture. See\n[transition duration](../../docs/authoring-spec-v0.md#transition-duration) for the\nparameter, unit, and validation contract.\n\n`stacking-card.v0.json` sets')
          replace(examples, 'covers the\nten lowering cases for typed inputs', 'covers\ntyped inputs')
          replace(examples, 'cargo test --test authoring_behavior_blend_contract\n',
              'cargo test --test authoring_behavior_blend_contract\ncargo test --test authoring_transition_duration_contract\n')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meta/contracts/authoring.md examples/authoring/README.md
          git commit -m 'docs(authoring): reconcile transition duration contract and examples (#225)'
          git push origin HEAD:refs/heads/agent/authoring-transition-duration
