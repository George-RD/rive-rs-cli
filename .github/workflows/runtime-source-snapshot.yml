name: Apply runtime eval implementation

on:
  push:
    branches: [agent/runtime-eval-evidence]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/runtime-eval-evidence
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Apply the tested runtime-eval implementation
        run: |
          python3 - <<'PY'
          import base64
          import io
          import pathlib
          import tarfile

          payload = base64.b64decode(
              pathlib.Path('.github/runtime-eval-implementation.b64').read_text()
          )
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              archive.extractall('.')
          PY
          cargo fmt --all
          rm .github/runtime-eval-implementation.b64
          rm .github/workflows/runtime-source-snapshot.yml
      - name: Persist implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add official-runtime evidence to AI evals"
          git push origin HEAD:agent/runtime-eval-evidence
      - name: Run Rust verification
        id: rust
        continue-on-error: true
        run: |
          set -o pipefail
          {
            cargo fmt --check
            cargo clippy --all-targets --all-features -- -D warnings
            cargo test --locked --all-features
          } 2>&1 | tee runtime-eval-rust.log
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - name: Run official-runtime eval suite
        id: runtime
        continue-on-error: true
        run: |
          set -o pipefail
          cargo run --quiet -- ai lab \
            --suite evals/suites/runtime_contract.v1.json \
            --provider template \
            --output-dir target/eval-runtime 2>&1 | tee runtime-eval.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-eval-verification
          path: |
            runtime-eval-rust.log
            runtime-eval.log
            target/eval-runtime
          retention-days: 7
      - name: Fail when verification failed
        if: steps.rust.outcome == 'failure' || steps.runtime.outcome == 'failure'
        run: exit 1
