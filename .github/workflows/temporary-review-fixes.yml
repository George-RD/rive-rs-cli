name: Temporary review fixes

on:
  push:
    branches: [feat/182-authoring-semantic-evals]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/182-authoring-semantic-evals
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply reviewed changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runner = Path('src/ai/eval/runner.rs')
          text = runner.read_text()
          text = text.replace(
              'use super::validation::{evaluate_gates, resolve_eval_config, validate_baseline, validate_suite};',
              'use super::validation::{\n    EvalMetrics, evaluate_gates, resolve_eval_config, validate_baseline, validate_suite,\n};',
          )
          text = text.replace(
              '#[derive(Debug)]\nstruct CaseRunError {',
              '#[derive(Debug, thiserror::Error)]\n#[error("{reason}")]\nstruct CaseRunError {',
          )
          old_read = '''        let input = fs::read_to_string(&fixture_path).map_err(|error| CaseRunError {
              reason: format!(
                  "failed to read AuthoringSpec fixture {}: {}",
                  fixture_path.display(),
                  error
              ),
              stage: Some(EvalFailureStage::AuthoringSchema),
              diagnostics: Vec::new(),
          })?;'''
          new_read = '''        let input = fs::read_to_string(&fixture_path).map_err(|error| {
              CaseRunError::structural(format!(
                  "failed to read AuthoringSpec fixture {}: {}",
                  fixture_path.display(),
                  error
              ))
          })?;'''
          if old_read not in text:
              raise SystemExit('runner fixture-read snippet not found')
          text = text.replace(old_read, new_read)
          old_semantic = '''            evaluate_semantics(case_dir, &repaired.scene_json, source_map, expectations)'''
          new_semantic = '''            evaluate_semantics(
                  case_dir,
                  &repaired.scene_json,
                  source_map,
                  expectations,
                  runtime.as_ref().is_some_and(|evidence| evidence.passed),
              )'''
          if old_semantic not in text:
              raise SystemExit('runner semantic snippet not found')
          text = text.replace(old_semantic, new_semantic)
          old_gates = '''    let gate_failures = evaluate_gates(
              &suite.gates,
              validity_rate,
              trait_adherence_rate,
              pipeline_reproducibility_rate,
              runtime_pass_rate,
              semantic_static_pass_rate,
              semantic_animated_pass_rate,
              average_retries,
              drift_count,
          );'''
          new_gates = '''    let metrics = EvalMetrics {
              validity_rate,
              trait_adherence_rate,
              pipeline_reproducibility_rate,
              runtime_pass_rate,
              semantic_static_pass_rate,
              semantic_animated_pass_rate,
              average_retries,
              drift_count,
          };
          let gate_failures = evaluate_gates(&suite.gates, &metrics);'''
          if old_gates not in text:
              raise SystemExit('runner gate snippet not found')
          text = text.replace(old_gates, new_gates)
          runner.write_text(text)

          semantic = Path('src/ai/eval/semantic.rs')
          text = semantic.read_text()
          old_signature = '''pub fn evaluate_semantics(
              case_dir: &Path,
              scene: &Value,
              source_map: &AuthoringSourceMap,
              expectations: &SemanticExpectations,
          ) -> SemanticEvidence {'''
          new_signature = '''pub fn evaluate_semantics(
              case_dir: &Path,
              scene: &Value,
              source_map: &AuthoringSourceMap,
              expectations: &SemanticExpectations,
              animated_runtime_available: bool,
          ) -> SemanticEvidence {'''
          if old_signature not in text:
              raise SystemExit('semantic signature not found')
          text = text.replace(old_signature, new_signature)
          old_animated = '''    let animated_checks = expectations
              .animated_checks
              .iter()
              .map(|check| animated_check(case_dir, check))
              .collect::<Vec<_>>();'''
          new_animated = '''    let animated_checks = if animated_runtime_available {
              expectations
                  .animated_checks
                  .iter()
                  .map(|check| animated_check(case_dir, check))
                  .collect::<Vec<_>>()
          } else {
              Vec::new()
          };'''
          if old_animated not in text:
              raise SystemExit('semantic animated-check block not found')
          text = text.replace(old_animated, new_animated)
          semantic.write_text(text)

          validation = Path('src/ai/eval/validation.rs')
          text = validation.read_text()
          marker = '#[allow(clippy::too_many_arguments)]\npub fn evaluate_gates('
          index = text.find(marker)
          if index < 0:
              raise SystemExit('validation gate function not found')
          prefix = text[:index]
          replacement = '''#[derive(Debug, Clone, Copy)]
          pub(super) struct EvalMetrics {
              pub validity_rate: f64,
              pub trait_adherence_rate: f64,
              pub pipeline_reproducibility_rate: f64,
              pub runtime_pass_rate: f64,
              pub semantic_static_pass_rate: f64,
              pub semantic_animated_pass_rate: f64,
              pub average_retries: f64,
              pub drift_count: usize,
          }

          pub fn evaluate_gates(gates: &EvalGates, metrics: &EvalMetrics) -> Vec<String> {
              let mut failures = Vec::new();
              if metrics.validity_rate < gates.min_validity_rate {
                  failures.push(format!(
                      "validity rate {:.3} is below {:.3}",
                      metrics.validity_rate, gates.min_validity_rate
                  ));
              }
              if metrics.trait_adherence_rate < gates.min_trait_adherence_rate {
                  failures.push(format!(
                      "trait adherence rate {:.3} is below {:.3}",
                      metrics.trait_adherence_rate, gates.min_trait_adherence_rate
                  ));
              }
              if metrics.pipeline_reproducibility_rate < gates.min_pipeline_reproducibility_rate {
                  failures.push(format!(
                      "pipeline reproducibility rate {:.3} is below {:.3}",
                      metrics.pipeline_reproducibility_rate, gates.min_pipeline_reproducibility_rate
                  ));
              }
              if metrics.runtime_pass_rate < gates.min_runtime_pass_rate {
                  failures.push(format!(
                      "runtime pass rate {:.3} is below {:.3}",
                      metrics.runtime_pass_rate, gates.min_runtime_pass_rate
                  ));
              }
              if metrics.semantic_static_pass_rate < gates.min_semantic_static_pass_rate {
                  failures.push(format!(
                      "static semantic pass rate {:.3} is below {:.3}",
                      metrics.semantic_static_pass_rate, gates.min_semantic_static_pass_rate
                  ));
              }
              if metrics.semantic_animated_pass_rate < gates.min_semantic_animated_pass_rate {
                  failures.push(format!(
                      "animated semantic pass rate {:.3} is below {:.3}",
                      metrics.semantic_animated_pass_rate, gates.min_semantic_animated_pass_rate
                  ));
              }
              if gates
                  .max_average_retries
                  .is_some_and(|maximum| metrics.average_retries > maximum)
              {
                  failures.push(format!(
                      "average retries {:.3} exceeds {:.3}",
                      metrics.average_retries,
                      gates.max_average_retries.unwrap_or_default()
                  ));
              }
              if metrics.drift_count > gates.max_drift_count {
                  failures.push(format!(
                      "drift count {} exceeds {}",
                      metrics.drift_count, gates.max_drift_count
                  ));
              }
              failures
          }
          '''
          validation.write_text(prefix + replacement)

          tests = Path('src/ai/eval/mod.rs')
          text = tests.read_text()
          text = text.replace(
              '        evaluate_gates, resolve_eval_config, validate_baseline, validate_suite,',
              '        EvalMetrics, evaluate_gates, resolve_eval_config, validate_baseline, validate_suite,',
          )
          old_static_call = '''            &expectations,
          );'''
          if old_static_call not in text:
              raise SystemExit('static semantic test call not found')
          text = text.replace(old_static_call, '''            &expectations,
              false,
          );''', 1)
          old_animated_call = '''        let evidence =
              evaluate_semantics(&root, &serde_json::json!({}), &source_map, &expectations);'''
          new_animated_call = '''        let evidence = evaluate_semantics(
              &root,
              &serde_json::json!({}),
              &source_map,
              &expectations,
              true,
          );'''
          if old_animated_call not in text:
              raise SystemExit('animated semantic test call not found')
          text = text.replace(old_animated_call, new_animated_call)
          anchor = '''        let _ = std::fs::remove_dir_all(root);
          }

          #[test]
          fn hash_bytes_is_deterministic()'''
          added = '''        let _ = std::fs::remove_dir_all(root);
          }

          #[test]
          fn semantic_animated_checks_skip_when_runtime_evidence_failed() {
              let source_map = AuthoringSourceMap { entries: Vec::new() };
              let expectations = SemanticExpectations {
                  static_checks: Vec::new(),
                  animated_checks: vec![AnimatedSemanticCheck::FramesDiffer { from: 0, to: 30 }],
              };
              let evidence = evaluate_semantics(
                  std::path::Path::new("unused"),
                  &serde_json::json!({}),
                  &source_map,
                  &expectations,
                  false,
              );
              assert_eq!(evidence.animated_passed, None);
              assert!(evidence.animated_checks.is_empty());
          }

          #[test]
          fn hash_bytes_is_deterministic()'''
          if anchor not in text:
              raise SystemExit('semantic test insertion anchor not found')
          text = text.replace(anchor, added)
          old_gate_assert = '''        assert_eq!(
              evaluate_gates(&gates, 0.8, 0.7, 0.5, 0.5, 0.6, 0.4, 2.0, 1).len(),
              8
          );'''
          new_gate_assert = '''        let metrics = EvalMetrics {
              validity_rate: 0.8,
              trait_adherence_rate: 0.7,
              pipeline_reproducibility_rate: 0.5,
              runtime_pass_rate: 0.5,
              semantic_static_pass_rate: 0.6,
              semantic_animated_pass_rate: 0.4,
              average_retries: 2.0,
              drift_count: 1,
          };
          assert_eq!(evaluate_gates(&gates, &metrics).len(), 8);'''
          if old_gate_assert not in text:
              raise SystemExit('gate test assertion not found')
          text = text.replace(old_gate_assert, new_gate_assert)
          tests.write_text(text)
          PY
          cargo fmt
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai/eval
          git commit -m "fix: address semantic eval review findings"
          git push origin HEAD:feat/182-authoring-semantic-evals
