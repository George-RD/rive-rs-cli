name: Temporary review fixes

on:
  push:
    branches: [feat/182-authoring-semantic-evals]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/182-authoring-semantic-evals
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply reviewed changes
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply.py
          python3 /tmp/apply.py
          cargo fmt
      - name: Verify Rust quality gates
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Verify semantic evaluation gate
        run: |
          npm install --no-save playwright@1.62.0
          npx playwright install --with-deps chromium
          cargo run --quiet -- ai lab \
            --suite evals/suites/runtime_contract.v1.json \
            --provider template \
            --output-dir target/eval-runtime
          cargo run --quiet -- ai lab \
            --suite evals/suites/authoring_semantic.v1.json \
            --provider template \
            --output-dir target/eval-authoring-semantic
      - name: Commit verified fixes
        run: |
          rm .github/workflows/temporary-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete authoring semantic eval evidence"
          git push origin HEAD:feat/182-authoring-semantic-evals
