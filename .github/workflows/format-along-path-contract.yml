name: Format along-path contract

on:
  push:
    branches:
      - agent/along-path-pattern-v0

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/along-path-pattern-v0
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit the formatted contract without workflow machinery
        run: |
          rm .github/workflows/format-along-path-contract.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: format along-path contract"
          git push origin HEAD:agent/along-path-pattern-v0
