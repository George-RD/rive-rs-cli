name: Authoring guard focused verification

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/finish-transition-guards.py
      - .github/workflows/authoring-guard-finish.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/authoring-all-conditions'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare documents and review regression
        run: |
          python3 scripts/finish-transition-guards.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/authoring_transition_guard_contract.rs')
          with path.open('a') as file:
              file.write('''
          #[test]
          fn oversized_transition_collections_fail_before_nested_guards() {
              for in_region in [false, true] {
                  let mut input = document();
                  let many = json!(vec![json!({
                      "id": "go", "from": "resting", "to": "engaged", "when": { "all": [] }
                  }); 1001]);
                  let chart = &mut input["behavior"]["statecharts"][0];
                  let path = if in_region {
                      chart["regions"] = json!([{
                          "id": "secondary", "initial": "resting",
                          "states": chart["states"].clone(), "transitions": many
                      }]);
                      "$.behavior.statecharts[0].regions[0].transitions"
                  } else {
                      chart["transitions"] = many;
                      "$.behavior.statecharts[0].transitions"
                  };
                  let spec: AuthoringSpec = serde_json::from_value(input.clone()).expect("typed document");
                  let typed = lower_authoring(&spec).expect_err("oversized outer collection");
                  let from_json = lower_authoring_json(&input.to_string()).expect_err("same JSON boundary");
                  assert_eq!(typed, from_json);
                  assert_eq!(typed.diagnostics[0].code, "invalid_behavior_collection_count");
                  assert_eq!(typed.diagnostics[0].path, path);
              }
          }
          ''')
          PY
          cargo fmt
          node --check tests/playwright/authoring-transition-guard-runtime.js
          git diff --check
      - name: Prove review finding and correct validation order
        run: |
          if cargo test --locked --test authoring_transition_guard_contract oversized_transition_collections_fail_before_nested_guards > guard-review-red.log 2>&1; then
            cat guard-review-red.log
            exit 1
          fi
          cat guard-review-red.log
          grep -q 'FAILED' guard-review-red.log
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/authoring/behavior_limits.rs')
          text = path.read_text()
          line = '            validate_transition_guards(&region.transitions, &region_path)?;\n'
          assert text.count(line) == 1
          text = text.replace(line, '', 1)
          anchor = '                &format!("{region_path}.transitions"),\n            )?;\n'
          assert text.count(anchor) == 1
          path.write_text(text.replace(anchor, anchor + line, 1))
          path = Path('meta/todos/todo.behavior-authoring-compiler.md')
          with path.open('a') as file:
              file.write('\nStandards review also restored outer-before-inner region validation: an oversized\ntransition collection fails at its collection path before guard inspection. The\npublic JSON/typed regression first failed on the region path, then passed after\nreordering validation. Runtime guard evidence contains 30 interactive samples\nand 30 deterministic timing frames; final exact-head evidence is on PR #248.\n')
          PY
          cargo fmt
      - name: Verify public guard contracts
        run: |
          set -o pipefail
          cargo test --locked --test authoring_transition_guard_contract 2>&1 | tee guard-contracts.log
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee guard-clippy.log
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - name: Verify official-runtime guards
        run: |
          set -o pipefail
          node tests/playwright/authoring-transition-guard-runtime.js 2>&1 | tee guard-runtime.log
      - name: Commit verified source files and remove temporary runner
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          current=$(git ls-remote origin refs/heads/agent/authoring-all-conditions | cut -f1)
          test "$current" = "$EXPECTED_HEAD"
          rm scripts/finish-transition-guards.py .github/workflows/authoring-guard-finish.yml
          git add src/authoring/behavior_limits.rs tests/authoring_transition_guard_contract.rs docs/authoring-spec-v0.md ROADMAP.md meta/todos/todo.behavior-authoring-compiler.md scripts/finish-transition-guards.py .github/workflows/authoring-guard-finish.yml
          git diff --cached > guard-finalization.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(authoring): validate outer collections first and verify all guards (#247)'
          git push origin HEAD:refs/heads/agent/authoring-all-conditions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guard-focused-verification
          path: |
            guard-review-red.log
            guard-contracts.log
            guard-clippy.log
            guard-runtime.log
            guard-finalization.patch
            target/playwright-behavior/transition-guards
          retention-days: 7
