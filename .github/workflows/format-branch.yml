name: Format foundation branch

on:
  push:
    branches: [agent/cairn-foundation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cairn-foundation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Persist formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style: format foundation refactor"
            git push origin HEAD:agent/cairn-foundation
          fi
