name: Split authored visual model

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/authoring-spec-split'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authoring-spec-split
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply split and remove branch-only tooling
        run: |
          cp docs/authoring.schema.v0.json /tmp/authoring-schema-before.json
          python3 scripts/agent_split_authoring_spec.py
          git rm .github/workflows/agent-authoring-spec-split.yml
          git rm scripts/agent_split_authoring_spec.py
          cargo fmt --all
      - name: Prove generated schema is unchanged
        run: |
          cat > examples/_dump_authoring_schema.rs <<'RS'
          fn main() {
              let schema = rive_cli::authoring::authoring_schema();
              println!(
                  "{}",
                  serde_json::to_string_pretty(&schema).expect("serialize authoring schema")
              );
          }
          RS
          cargo run --quiet --example _dump_authoring_schema > docs/authoring.schema.v0.json
          rm examples/_dump_authoring_schema.rs
          cmp /tmp/authoring-schema-before.json docs/authoring.schema.v0.json
      - name: Verify behavior and lint
        run: |
          cargo test --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
      - name: Reconcile architecture and enforce split boundaries
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          set -o pipefail
          cairn scan --json | tee /tmp/cairn-scan.json
          cairn lint --json | tee /tmp/cairn-lint.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          findings = json.loads(Path('/tmp/cairn-scan.json').read_text())['findings']
          targeted_paths = {'src/authoring/spec.rs', 'src/authoring/visual.rs'}
          blocked_codes = {'CAIRN_MODULE_OVERSIZED', 'CAIRN_RECONCILE_ORPHANED_FILE'}
          blocked = [
              finding
              for finding in findings
              if finding.get('code') in blocked_codes
              and finding.get('path') in targeted_paths
          ]
          if blocked:
              raise SystemExit(f'targeted Cairn findings remain: {blocked}')

          for path in sorted(targeted_paths):
              lines = len(Path(path).read_text().splitlines())
              if lines > 500:
                  raise SystemExit(f'{path} remains oversized at {lines} lines')
              print(f'{path}={lines} lines')
          PY
      - name: Commit verified split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: separate authored visual nodes"
          git push origin HEAD:agent/authoring-spec-split
