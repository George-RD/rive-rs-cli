name: Number binding workbench

on:
  push:
    branches: [agent/authoring-number-bindings]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export pinned source and branch audit
        run: |
          mkdir -p /tmp/rive-workbench
          git rev-parse HEAD > /tmp/rive-workbench/head.txt
          git archive --format=tar.gz HEAD > /tmp/rive-workbench/source.tar.gz
          git for-each-ref --format='%(refname:short)' refs/remotes/origin | while read -r ref; do
            printf '%s ' "$ref"
            git rev-list --left-right --count origin/main..."$ref"
          done > /tmp/rive-workbench/branches.txt
      - name: Read Cairn context
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cairn context > /tmp/rive-workbench/cairn-context.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: number-binding-workbench-source
          path: /tmp/rive-workbench
          retention-days: 7
