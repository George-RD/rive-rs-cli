name: Stage authoring lower split

on:
  push:
    branches: [agent/authoring-lower-split]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  stage:
    if: github.event.head_commit.message == 'chore: stage authoring lower split'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/authoring-lower-split
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
      - name: Confirm the Cairn RED condition
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cairn scan --json > /tmp/cairn-before.json
          grep -q 'src/authoring/lower.rs' /tmp/cairn-before.json
          grep -q 'CAIRN_MODULE_OVERSIZED' /tmp/cairn-before.json
      - name: Split the lowerer by responsibility
        run: python3 scripts/stage_authoring_lower_split.py
      - name: Format and verify Rust behavior
        run: |
          cargo fmt
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
      - name: Reconcile and verify Cairn
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cairn scan --json > /tmp/cairn-after.json
          cairn lint --json > /tmp/cairn-lint.json
          if grep -E 'CAIRN_MODULE_OVERSIZED.*src/authoring/lower' map.md; then
            echo 'authoring lowerer remains oversized' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          paths = [Path('src/authoring/lower.rs'), *sorted(Path('src/authoring/lower').glob('*.rs'))]
          for path in paths:
              lines = len(path.read_text().splitlines())
              print(f'{path}: {lines} lines')
              if lines > 500:
                  raise SystemExit(f'{path} exceeds the 500-line guideline')
          PY
      - name: Commit the verified refactor
        run: |
          rm .github/workflows/stage-authoring-lower-split.yml
          rm scripts/stage_authoring_lower_split.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git status --short
          git commit -m 'refactor: split authoring lowering responsibilities'
          git push origin HEAD:agent/authoring-lower-split
