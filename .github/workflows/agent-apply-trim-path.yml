name: Apply authored trim-path implementation

on:
  push:
    branches:
      - agent/authoring-trim-path-v0

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authoring-trim-path-v0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}")
              file.write_text(text.replace(old, new))

          replace(
              "src/authoring/spec.rs",
              '''#[derive(Debug, Clone, Serialize, Deserialize, JsonSchema)]
          #[serde(deny_unknown_fields)]
          pub struct StrokeSpec {
              #[serde(alias = "color")]
              pub paint: PaintSpec,
              pub width: ScalarExpr,
          }
          ''',
              '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize, JsonSchema)]
          #[serde(rename_all = "snake_case")]
          pub enum TrimPathMode {
              Sequential,
              Synchronized,
          }

          #[derive(Debug, Clone, Serialize, Deserialize, JsonSchema)]
          #[serde(deny_unknown_fields)]
          pub struct TrimPathSpec {
              pub start: ScalarExpr,
              pub end: ScalarExpr,
              #[serde(default)]
              pub offset: Option<ScalarExpr>,
              pub mode: TrimPathMode,
          }

          #[derive(Debug, Clone, Serialize, Deserialize, JsonSchema)]
          #[serde(deny_unknown_fields)]
          pub struct StrokeSpec {
              #[serde(alias = "color")]
              pub paint: PaintSpec,
              pub width: ScalarExpr,
              #[serde(default)]
              pub trim: Option<TrimPathSpec>,
          }
          ''',
          )

          replace(
              "src/authoring/lower.rs",
              '''    AuthoringSpec, ComponentSpec, GradientKind, LoweredAuthoring, PaintSpec, Quantity,
              ShapeNodeRef, SourceMapEntry, Unit, VisualNode,
          ''',
              '''    AuthoringSpec, ComponentSpec, GradientKind, LoweredAuthoring, PaintSpec, Quantity,
              ShapeNodeRef, SourceMapEntry, TrimPathMode, TrimPathSpec, Unit, VisualNode,
          ''',
          )

          replace(
              "src/authoring/lower.rs",
              '''struct LoweredPaint {
              object: Value,
              runtime_names: Vec<String>,
              scene_paths: Vec<String>,
          }
          ''',
              '''struct LoweredPaint {
              object: Value,
              runtime_names: Vec<String>,
              scene_paths: Vec<String>,
          }

          struct LoweredTrimPath {
              object: Value,
              runtime_name: String,
              scene_path: String,
          }
          ''',
          )

          replace(
              "src/authoring/lower.rs",
              '''        if let (Some(stroke), Some(thickness)) = (stroke, stroke_thickness) {
              let stroke_name = runtime_name(&runtime_segments, "stroke");
              let LoweredPaint {
                  object: stroke_paint,
                  runtime_names: stroke_runtime_names,
                  scene_paths: stroke_scene_paths,
              } = self.lower_paint(
                  &stroke.paint,
                  &format!("{authored_path}.stroke.paint"),
                  &runtime_segments,
                  &format!("{scene_path}/children/2/children/0"),
                  scope,
                  PaintTarget::Stroke,
              )?;
              runtime_names.push(stroke_name.clone());
              runtime_names.extend(stroke_runtime_names);
              scene_paths.push(format!("{scene_path}/children/2"));
              scene_paths.extend(stroke_scene_paths);
              children.push(json!({
                  "type": "stroke",
                  "name": stroke_name,
                  "thickness": thickness,
                  "children": [stroke_paint]
              }));
          }
          ''',
              '''        if let (Some(stroke), Some(thickness)) = (stroke, stroke_thickness) {
              let stroke_name = runtime_name(&runtime_segments, "stroke");
              let LoweredPaint {
                  object: stroke_paint,
                  runtime_names: stroke_runtime_names,
                  scene_paths: stroke_scene_paths,
              } = self.lower_paint(
                  &stroke.paint,
                  &format!("{authored_path}.stroke.paint"),
                  &runtime_segments,
                  &format!("{scene_path}/children/2/children/0"),
                  scope,
                  PaintTarget::Stroke,
              )?;
              runtime_names.push(stroke_name.clone());
              runtime_names.extend(stroke_runtime_names);
              scene_paths.push(format!("{scene_path}/children/2"));
              scene_paths.extend(stroke_scene_paths);

              let mut stroke_children = vec![stroke_paint];
              if let Some(trim) = &stroke.trim {
                  let LoweredTrimPath {
                      object,
                      runtime_name,
                      scene_path,
                  } = self.lower_trim_path(
                      trim,
                      &format!("{authored_path}.stroke.trim"),
                      &runtime_segments,
                      &format!("{scene_path}/children/2/children/1"),
                      scope,
                  )?;
                  runtime_names.push(runtime_name);
                  scene_paths.push(scene_path);
                  stroke_children.push(object);
              }

              children.push(json!({
                  "type": "stroke",
                  "name": stroke_name,
                  "thickness": thickness,
                  "children": stroke_children
              }));
          }
          ''',
          )

          replace(
              "src/authoring/lower.rs",
              '''    fn lower_paint(
          ''',
              '''    fn lower_trim_path(
              &self,
              trim: &TrimPathSpec,
              authored_path: &str,
              runtime_segments: &[String],
              scene_path: &str,
              scope: &BTreeMap<String, Quantity>,
          ) -> Result<LoweredTrimPath, AuthoringDiagnostic> {
              let start = evaluate_expression(
                  &trim.start,
                  &format!("{authored_path}.start"),
                  scope,
                  Unit::Scalar,
              )?;
              if !(0.0..=1.0).contains(&start) {
                  return Err(AuthoringDiagnostic::new(
                      format!("{authored_path}.start"),
                      "invalid_ratio",
                      "trim start must be between zero and one",
                  ));
              }

              let end = evaluate_expression(
                  &trim.end,
                  &format!("{authored_path}.end"),
                  scope,
                  Unit::Scalar,
              )?;
              if !(0.0..=1.0).contains(&end) {
                  return Err(AuthoringDiagnostic::new(
                      format!("{authored_path}.end"),
                      "invalid_ratio",
                      "trim end must be between zero and one",
                  ));
              }

              let offset = trim
                  .offset
                  .as_ref()
                  .map(|expression| {
                      evaluate_expression(
                          expression,
                          &format!("{authored_path}.offset"),
                          scope,
                          Unit::Scalar,
                      )
                  })
                  .transpose()?
                  .unwrap_or(0.0);
              let mode = match trim.mode {
                  TrimPathMode::Sequential => "sequential",
                  TrimPathMode::Synchronized => "synchronized",
              };
              let runtime_name = runtime_name(runtime_segments, "stroke_trim");

              Ok(LoweredTrimPath {
                  object: json!({
                      "type": "trim_path",
                      "name": runtime_name.clone(),
                      "start": start,
                      "end": end,
                      "offset": offset,
                      "mode": mode
                  }),
                  runtime_name,
                  scene_path: scene_path.to_string(),
              })
          }

              fn lower_paint(
          ''',
          )

          replace(
              "src/authoring/frontend.rs",
              '''        if let Some(stroke) = shape.stroke {
              validate_paint(&stroke.paint, &format!("{path}.stroke.paint"), diagnostics);
              validate_expression(&stroke.width, &format!("{path}.stroke.width"), diagnostics);
          }
          ''',
              '''        if let Some(stroke) = shape.stroke {
              validate_paint(&stroke.paint, &format!("{path}.stroke.paint"), diagnostics);
              validate_expression(&stroke.width, &format!("{path}.stroke.width"), diagnostics);
              if let Some(trim) = &stroke.trim {
                  validate_expression(
                      &trim.start,
                      &format!("{path}.stroke.trim.start"),
                      diagnostics,
                  );
                  validate_expression(
                      &trim.end,
                      &format!("{path}.stroke.trim.end"),
                      diagnostics,
                  );
                  if let Some(offset) = &trim.offset {
                      validate_expression(
                          offset,
                          &format!("{path}.stroke.trim.offset"),
                          diagnostics,
                      );
                  }
              }
          }
          ''',
          )

          replace(
              "docs/authoring-spec-v0.md",
              "The visual compiler slice is intentionally narrow. It supports ellipses, rectangles, triangles, polygons, stars, groups, component instances, and raw `SceneSpec` objects. Shape fills and strokes share one solid/linear/radial paint contract; stroke width is a positive pixel expression. Polygon and star point counts must be at least three; star inner radius is a scalar ratio from zero to one. Bounded patterns, constraints, motion helpers, and statechart authoring remain separate roadmap items.",
              "The visual compiler slice is intentionally narrow. It supports ellipses, rectangles, triangles, polygons, stars, groups, component instances, and raw `SceneSpec` objects. Shape fills and strokes share one solid/linear/radial paint contract; stroke width is a positive pixel expression, and strokes may include a typed trim path. Polygon and star point counts must be at least three; star inner radius is a scalar ratio from zero to one. Bounded patterns, constraints, motion helpers, and statechart authoring remain separate roadmap items.",
          )

          replace(
              "docs/authoring-spec-v0.md",
              '''The previous `color` field remains accepted as a parser compatibility alias for `paint`, but `paint` is the canonical v0 schema field.
          ''',
              '''The previous `color` field remains accepted as a parser compatibility alias for `paint`, but `paint` is the canonical v0 schema field.

          A stroke may optionally add a typed trim path after its paint child:

          ```json
          "trim": {
            "start": { "kind": "literal", "value": 0.1, "unit": "scalar" },
            "end": { "kind": "parameter", "name": "trim-end" },
            "offset": { "kind": "literal", "value": 0, "unit": "scalar" },
            "mode": "sequential"
          }
          ```

          `start` and `end` are normalized scalar expressions from zero to one. `offset` is an optional scalar expression that defaults to zero and is intentionally not clamped, allowing complete-cycle wrapping. `mode` is either `sequential` or `synchronized`. The generated trim object receives a deterministic runtime name and source-map path.
          ''',
          )

          replace(
              "meta/todos/todo.visual-authoring-compiler.md",
              '''- Typed linear and radial gradient strokes are implemented in PR #140 through the
            shared `PaintSpec` and paint-lowering helper. `stroke.paint` is canonical while
            the previous solid `stroke.color` form remains accepted as a parser alias.
          - The next bounded visual slice is authored trim-path support on strokes, keeping
            trim expressions, generated runtime objects, and diagnostics source-mapped.
          - Remaining work includes text and assets, bounded patterns, constraints, and a
            complex static showcase without raw escapes.
          ''',
              '''- Typed linear and radial gradient strokes are implemented in PR #140 through the
            shared `PaintSpec` and paint-lowering helper. `stroke.paint` is canonical while
            the previous solid `stroke.color` form remains accepted as a parser alias.
          - Typed trim paths on strokes are implemented in PR #141. Start, end, and optional
            offset expressions flow through component parameters and overrides; generated trim
            objects, runtime names, SceneSpec paths, and diagnostics remain source-mapped.
          - Remaining work includes text and assets, bounded patterns, constraints, and a
            complex static showcase without raw escapes.
          ''',
          )
          PY

          cargo fmt --all
          cargo test --locked --all-features --test authoring_trim_path_contract

          cat > examples/_dump_authoring_schema.rs <<'RS'
          fn main() {
              let schema = rive_cli::authoring::authoring_schema();
              println!(
                  "{}",
                  serde_json::to_string_pretty(&schema).expect("serialize authoring schema")
              );
          }
          RS
          cargo run --quiet --example _dump_authoring_schema > docs/authoring.schema.v0.json
          rm examples/_dump_authoring_schema.rs

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authoring/spec.rs src/authoring/lower.rs src/authoring/frontend.rs \
            docs/authoring-spec-v0.md docs/authoring.schema.v0.json \
            meta/todos/todo.visual-authoring-compiler.md
          git commit -m "feat: lower authored trim paths"
          git push origin HEAD:agent/authoring-trim-path-v0
