async function mountBehaviorInteraction(page) {
  const runtimeErrors = [];
  page.on("pageerror", (error) => runtimeErrors.push(String(error)));
  page.on("console", (message) => {
    if (message.type() === "error") {
      runtimeErrors.push(message.text());
    }
  });

  const result = await page.evaluate(async (plan) => {
    const originalCanvas = document.getElementById("canvas");
    if (!originalCanvas) {
      return { ok: false, error: "missing canvas" };
    }
    originalCanvas.style.display = "none";

    const controlledCanvas = document.createElement("canvas");
    controlledCanvas.id = "canvas-controlled";
    controlledCanvas.style.width = originalCanvas.style.width;
    controlledCanvas.style.height = originalCanvas.style.height;
    controlledCanvas.width = originalCanvas.width;
    controlledCanvas.height = originalCanvas.height;
    originalCanvas.parentElement.appendChild(controlledCanvas);

    try {
      let runtime;
      await new Promise((resolve, reject) => {
        runtime = new rive.Rive({
          src: `${plan.fixture}.riv`,
          canvas: controlledCanvas,
          autoplay: false,
          autoBind: false,
          stateMachines: [plan.stateMachine],
          onLoad: resolve,
          onLoadError: (error) => reject(new Error(String(error || "rive load error"))),
        });
      });

      const viewModel = runtime.viewModelByName(plan.viewModel);
      if (!viewModel) {
        throw new Error(`missing view model ${plan.viewModel}`);
      }
      const instance = viewModel.instance();
      if (!instance) {
        throw new Error(`could not create instance for ${plan.viewModel}`);
      }
      const property = instance.boolean(plan.property);
      if (!property) {
        throw new Error(`missing boolean property ${plan.property}`);
      }
      property.value = false;
      runtime.bindViewModelInstance(instance);
      window.__VISUAL_RIVE = runtime;
      window.__BEHAVIOR_BOOL = property;
      await new Promise((resolve) => setTimeout(resolve, 150));
      return { ok: true, error: "" };
    } catch (error) {
      return { ok: false, error: String(error?.message || error || "unknown error") };
    }
  }, BEHAVIOR_INTERACTION);

  if (!result.ok) {
    throw new Error(`${BEHAVIOR_INTERACTION.fixture}.riv behavior mount failed: ${result.error}`);
  }
  if (runtimeErrors.length > 0) {
    throw new Error(`${BEHAVIOR_INTERACTION.fixture}.riv runtime errors: ${runtimeErrors.join(" | ")}`);
  }

  return runtimeErrors;
}

async function setBehaviorProperty(page, value) {
  const changed = await page.evaluate(async (nextValue) => {
    if (!window.__BEHAVIOR_BOOL) {
      return false;
    }
    window.__BEHAVIOR_BOOL.value = nextValue;
    await new Promise((resolve) => setTimeout(resolve, 250));
    return true;
  }, value);
  if (!changed) {
    throw new Error("behavior boolean property was not available in the official runtime");
  }
}

async function runBehaviorInteraction(browser, port, update, rows) {
  const fixture = BEHAVIOR_INTERACTION.fixture;
  const page = await openFixturePage(browser, port, fixture, {
    pageOptions: { viewport: { width: 512, height: 512 }, deviceScaleFactor: 2 },
  });
  let runtimeErrors = [];
  try {
    runtimeErrors = await mountBehaviorInteraction(page);
    const restingCurrent = path.join(CURRENT_DIR, `${fixture}-resting.png`);
    const engagedCurrent = path.join(CURRENT_DIR, `${fixture}-engaged.png`);
    const restingBaseline = path.join(BASELINE_DIR, `${fixture}-resting.png`);
    const engagedBaseline = path.join(BASELINE_DIR, `${fixture}-engaged.png`);

    await captureCanvasPng(page, restingCurrent);
    await setBehaviorProperty(page, true);
    await captureCanvasPng(page, engagedCurrent);

    if (runtimeErrors.length > 0) {
      throw new Error(`${fixture}.riv runtime errors: ${runtimeErrors.join(" | ")}`);
    }

    const transitionDiff = comparePngPixels(restingCurrent, engagedCurrent);
    if (transitionDiff <= 0.5) {
      throw new Error(
        `${fixture}.riv did not visibly transition after changing the bound view-model property ` +
          `(pixel diff ${transitionDiff.toFixed(4)}%)`,
      );
    }

    if (update) {
      fs.copyFileSync(restingCurrent, restingBaseline);
      fs.copyFileSync(engagedCurrent, engagedBaseline);
      rows.push({ name: `${fixture}@resting`, status: "updated", diffText: "0.0000" });
      rows.push({ name: `${fixture}@engaged`, status: "updated", diffText: "0.0000" });
      rows.push({ name: `${fixture}@transition`, status: "pass", diffText: transitionDiff.toFixed(4) });
      return { failed: false, missing: false };
    }

    let failed = false;
    let missing = false;
    for (const [state, currentPath, baselinePath] of [
      ["resting", restingCurrent, restingBaseline],
      ["engaged", engagedCurrent, engagedBaseline],
    ]) {
      if (!fs.existsSync(baselinePath)) {
        rows.push({ name: `${fixture}@${state}`, status: "missing", diffText: "-" });
        missing = true;
        continue;
      }
      const diffPercent = comparePngPixels(currentPath, baselinePath);
      const pass = diffPercent <= THRESHOLD_PERCENT;
      rows.push({
        name: `${fixture}@${state}`,
        status: pass ? "pass" : "fail",
        diffText: diffPercent.toFixed(4),
      });
      failed ||= !pass;
    }
    rows.push({ name: `${fixture}@transition`, status: "pass", diffText: transitionDiff.toFixed(4) });
    return { failed, missing };
  } finally {
    await page.close();
  }
}

