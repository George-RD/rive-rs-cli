name: Temporary rustfmt

on:
  push:
    branches: [feat/182-authoring-semantic-evals]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/182-authoring-semantic-evals
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/ai/eval
            git commit -m "style: apply rustfmt to semantic eval changes"
            git push origin HEAD:feat/182-authoring-semantic-evals
          fi
