name: Startup workbench
on:
  push:
    branches: [agent/showcase-startup-reproduction]
    paths: [.github/workflows/startup-workbench.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - name: Compare pinned base and corrected scheduler
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          root = pathlib.Path('target/startup-comparison')
          root.mkdir(parents=True, exist_ok=True)
          playback = pathlib.Path('site/playback.js')
          base = playback.read_text()
          old = '        global.cancelAnimationFrame(instance.frameRequestId);'
          new = '''        if (typeof instance.runtime?.cancelAnimationFrame === "function") {
                    instance.runtime.cancelAnimationFrame(instance.frameRequestId);
                  } else {
                    global.cancelAnimationFrame(instance.frameRequestId);
                  }'''
          assert base.count(old) == 1
          fixed = base.replace(old, new)
          (root / 'base-playback.js').write_text(base)
          (root / 'candidate-playback.js').write_text(fixed)
          evidence = {
            'base': '602ca840f750e966ce85d116cea48ee682d172ba',
            'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
            'node': subprocess.check_output(['node', '--version'], text=True).strip(),
            'playwright': subprocess.check_output(['node', '-p', 'require("playwright/package.json").version'], text=True).strip(),
            'files': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in [playback, pathlib.Path('assets/rive.js'), pathlib.Path('assets/rive.wasm'), *pathlib.Path('examples/authoring').glob('*.riv')]},
            'runs': [],
          }
          def run(label, args, retained=None):
            destination = root / label
            destination.mkdir()
            if retained:
              shutil.rmtree(retained, ignore_errors=True)
            try:
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=180)
              code, output = result.returncode, result.stdout
            except subprocess.TimeoutExpired as error:
              code, output = 124, error.stdout or b''
              if isinstance(output, bytes):
                output = output.decode(errors='replace')
              output += '\nWorkbench process deadline exceeded.\n'
            (destination / 'run.log').write_text(output)
            if retained and pathlib.Path(retained).exists():
              shutil.copytree(retained, destination / 'evidence')
            evidence['runs'].append({'label': label, 'command': args, 'exit_code': code})
            (root / 'evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
            print(f'{label}: exit {code}', flush=True)
            print(output[-1600:], flush=True)
            return code
          try:
            red = run('base-contracts', ['node', '--test', 'tests/playwright/site-scheduling-contract.js'])
            assert red != 0, 'Pinned production must fail the new scheduler contract'
            assert '# fail 2' in (root / 'base-contracts/run.log').read_text()
            playback.write_text(fixed)
            assert run('candidate-contracts', ['node', '--test', 'tests/playwright/site-scheduling-contract.js', 'tests/playwright/site-playback-contract.js']) == 0
            for repetition in range(1, 4):
              variants = [('base', base), ('candidate', fixed)]
              if repetition == 2:
                variants.reverse()
              for variant, source in variants:
                playback.write_text(source)
                run(f'{variant}-showcase-{repetition}', ['node', 'tests/playwright/showcase-validation.js'], 'target/showcase-validation')
            playback.write_text(fixed)
            for name in ['site-validation', 'site-playback', 'site-paused-controls']:
              run(f'candidate-{name}', ['node', f'tests/playwright/{name}.js'], 'target/site-paused-controls' if name == 'site-paused-controls' else None)
            assert all(r['exit_code'] == 0 for r in evidence['runs'] if r['label'].startswith('candidate-')), 'Candidate verification failed; retain all evidence'
          finally:
            playback.write_text(base)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-scheduler-comparison
          path: target/startup-comparison
          retention-days: 7
