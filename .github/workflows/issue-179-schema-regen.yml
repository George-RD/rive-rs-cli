name: Issue 179 schema regen

on:
  push:
    branches:
      - issue-179-typed-behavior
    paths:
      - scripts/issue179_schema_regen_trigger

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate scene schema
        env:
          UPDATE_SCENE_SCHEMA: "1"
        run: cargo test scene_schema_file_is_in_sync --lib --locked
      - name: Commit schema
        shell: bash
        run: |
          if git diff --quiet -- docs/scene.schema.v1.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scene.schema.v1.json
          git commit -m "docs(scene): regenerate schema for view-model binding"
          git push
