name: Apply constraint review hardening

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/simple-constraints-v0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simple-constraints-v0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: python .github/apply-constraint-review.py
      - run: cargo fmt --all
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features --test authoring_constraint_contract --test authoring_constraint_safety_contract
      - name: Commit verified review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authoring/constraint.rs src/authoring/limits.rs docs/authoring-spec-v0.md meta/contracts/authoring.md meta/todos/todo.visual-authoring-compiler.md cairn.blueprint
          git commit -m "Harden constraint dependency resolution"
          git push
