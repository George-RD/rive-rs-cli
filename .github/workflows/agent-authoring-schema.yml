name: Generate authoring schema

on:
  workflow_dispatch:
  push:
    branches: [agent/named-pose-tracks]
    paths:
      - src/authoring/**
      - tests/authoring_contract.rs
      - .github/workflows/agent-authoring-schema.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --all-features --test authoring_contract regenerate_published_authoring_schema -- --ignored
      - uses: actions/upload-artifact@v4
        with:
          name: authoring-schema
          path: docs/authoring.schema.v0.json
          retention-days: 1
