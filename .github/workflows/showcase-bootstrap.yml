name: Showcase artifact bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  authoring-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo run --quiet -- authoring compile \
            examples/authoring/complex-animated-showcase.v0.json \
            -o examples/authoring/complex-animated-showcase.v0.riv
      - name: Commit deterministic artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/authoring/complex-animated-showcase.v0.riv
          git commit -m "test(showcase): commit reproducible authoring artifact"
          git push origin HEAD:${{ github.head_ref }}
