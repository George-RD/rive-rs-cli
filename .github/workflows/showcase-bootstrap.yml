name: Showcase artifact bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  authoring-artifact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          mkdir -p target/showcase-bootstrap
          cargo run --quiet -- authoring compile \
            examples/authoring/complex-animated-showcase.v0.json \
            -o target/showcase-bootstrap/complex-animated-showcase.v0.riv
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-authoring-bootstrap
          path: target/showcase-bootstrap/complex-animated-showcase.v0.riv
          retention-days: 1
