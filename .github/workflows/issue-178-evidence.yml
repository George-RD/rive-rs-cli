name: Issue 178 bookkeeping

on:
  push:
    branches: [issue-178-complex-animated-showcase]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize Cairn and roadmap state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          motion_path = Path('meta/todos/todo.motion-authoring-compiler.md')
          motion = motion_path.read_text()
          old = 'status: in_progress\ncreated: 2026-07-29\n'
          assert old in motion
          motion = motion.replace(old, 'status: done\ncreated: 2026-07-29\ncompleted: 2026-08-28\n', 1)
          old = ('## Remaining\n\n'
                 '- Semantic entrance, exit, stagger, spring, bounce, and similar motion helpers.\n'
                 '- Color and additional non-transform property tracks.\n'
                 '- A complex animated showcase with retained official-runtime frame evidence.\n')
          assert old in motion
          new = ('## Completion evidence\n\n'
                 'Issue #178 / PR #197 closes the v0 motion product gate:\n\n'
                 '- a generic scattered → overloaded → connected → next-action AuthoringSpec uses stable authored IDs, four reusable poses, one shared easing, one compact track, opacity, transforms, and animated dimensions without raw escapes;\n'
                 '- repeated lowering preserves the lowered SceneSpec and source-map identity;\n'
                 '- the public `authoring compile` path produces the `.riv`, which passes the canonical builder, encoder, validator, and official-runtime load path;\n'
                 '- representative frames at 0, 36, 78, and 120 are retained as visual-regression evidence so motion failures are inspectable.\n\n'
                 'Semantic entrance/exit/stagger/spring/bounce helpers, broader color/property tracks,\n'
                 'and the easing/stacking hardening tracked in #193 and #194 are follow-up\n'
                 'convenience or correctness work. They are not blockers to the completed v0 motion\n'
                 'milestone.\n')
          motion_path.write_text(motion.replace(old, new, 1))

          delivery_path = Path('meta/todos/todo.authoring-delivery-path.md')
          delivery = delivery_path.read_text()
          old = 'status: in_progress\ncreated: 2026-08-25\n'
          assert old in delivery
          delivery = delivery.replace(old, 'status: done\ncreated: 2026-08-25\ncompleted: 2026-08-28\n', 1)
          old = ('4. #178 — prove the complex animated AuthoringSpec exit gate. This is the current\n'
                 '   implementation frontier.\n\n'
                 'After #178, typed behavior (#179-#181) and static/animated semantic evaluation\n'
                 '(#182) may advance independently.')
          assert old in delivery
          new = ('4. #178 — complex animated AuthoringSpec exit gate, complete in PR #197.\n\n'
                 'With #178 complete, typed behavior (#179-#181) and static/animated semantic\n'
                 'evaluation (#182) may advance independently.')
          delivery_path.write_text(delivery.replace(old, new, 1))

          roadmap_path = Path('ROADMAP.md')
          roadmap = roadmap_path.read_text()
          start = roadmap.index('**Current next item:')
          end = roadmap.index('\n\nThe ordered execution graph is:', start)
          frontier = ('**Current next item: [#179 — add the behavior compiler tracer-bullet slice](https://github.com/George-RD/rive-rs-cli/issues/179).**\n'
                      '[#178](https://github.com/George-RD/rive-rs-cli/issues/178) completed the complex\n'
                      'animated AuthoringSpec product gate in PR #197, including public-CLI compilation,\n'
                      'deterministic source identity, structural validation, and retained official-runtime\n'
                      'frames. [#182](https://github.com/George-RD/rive-rs-cli/issues/182) is independently\n'
                      'unblocked and may proceed in parallel with the behavior branch.')
          roadmap = roadmap[:start] + frontier + roadmap[end:]
          old = '  -> #178 complex animated AuthoringSpec exit gate\n'
          assert old in roadmap
          roadmap = roadmap.replace(old, '  -> #178 complex animated AuthoringSpec exit gate (complete in PR #197)\n', 1)
          rows = []
          for line in roadmap.splitlines():
              if line.startswith('| P1 | [Authoring delivery path]'):
                  line = '| P1 | [Authoring delivery path](meta/todos/todo.authoring-delivery-path.md) | complete in PR #197 | one-pass compiler, shared compile seam, first-class Authoring CLI, complex animated runtime proof |'
              elif line.startswith('| P2 | [Pose and motion compiler slice]'):
                  line = '| P2 | [Pose and motion compiler slice](meta/todos/todo.motion-authoring-compiler.md) | complete in PR #197 | compact tracks and poses reproduce complex motion with retained official-runtime proof through one compiler-owned scene draft |'
              elif line.startswith('| P2 | [Behavior and statechart compiler slice]'):
                  line = '| P2 | [Behavior and statechart compiler slice](meta/todos/todo.behavior-authoring-compiler.md) | open; #179 is next, then #180-#181 | view-model bindings and named statecharts reproduce interaction with runtime proof |'
              elif line.startswith('| P2 | [Semantic prompt evaluations]'):
                  line = '| P2 | [Semantic prompt evaluations](meta/todos/todo.semantic-prompt-evals.md) | open; #182 independently unblocked, #183 after #181 + #182 | semantic evidence reported separately from structural and runtime results |'
              rows.append(line)
          roadmap = '\n'.join(rows) + '\n'
          old = ('- #178 turns the real consumer-shaped scattered -> overloaded -> connected ->\n'
                 '  next-action animation into a generic retained animated showcase and runtime gate.')
          assert old in roadmap
          new = ('- #178 completed the generic scattered -> overloaded -> connected -> next-action\n'
                 '  animated showcase and retained official-runtime gate in PR #197.')
          roadmap_path.write_text(roadmap.replace(old, new, 1))
          PY
      - name: Commit synchronized state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ROADMAP.md meta/todos/todo.motion-authoring-compiler.md meta/todos/todo.authoring-delivery-path.md
          git commit -m 'docs(authoring): close animated delivery milestones'
          git push origin HEAD:issue-178-complex-animated-showcase
