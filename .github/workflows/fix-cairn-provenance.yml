name: Fix Cairn provenance

on:
  push:
    branches: [agent/cairn-foundation]

permissions:
  contents: write

concurrency:
  group: fix-cairn-provenance
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cairn-foundation
          fetch-depth: 0
      - name: Normalize provenance records
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          research = Path("meta/research/ai-authoring-format.md")
          text = research.read_text()
          research.write_text(text.replace("method: primary-and-comparative", "method: primary"))

          local_sources = {
              Path("meta/sources/control-panel-showcase.md"): Path("showcase/control_panel.json"),
              Path("meta/sources/scene-prompt-subset.md"): Path("docs/ai/scene-prompt-schema.json"),
              Path("meta/sources/scene-spec.md"): Path("src/builder/spec.rs"),
          }
          for record, source in local_sources.items():
              digest = sha256(source.read_bytes()).hexdigest()
              text = record.read_text()
              marker = "verification: verified\n"
              if "sha256:" not in text:
                  text = text.replace(marker, marker + f"sha256: {digest}\n", 1)
              record.write_text(text)

          discussion = Path("meta/sources/ai-authoring-discussion.md")
          text = discussion.read_text().replace("verification: verified", "verification: unverified")
          discussion.write_text(text)
          PY
      - name: Persist provenance normalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add meta/research meta/sources
          if ! git diff --cached --quiet; then
            git commit -m "docs: normalize Cairn provenance records"
            git push origin HEAD:agent/cairn-foundation
          fi
