name: Apply authoring validation cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/authoring-validation-cleanup'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authoring-validation-cleanup
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply refactor and remove branch-only tooling
        run: |
          python3 scripts/agent_refactor_authoring_validation.py
          git rm .github/workflows/agent-authoring-validation-cleanup.yml
          git rm scripts/agent_refactor_authoring_validation.py
          cargo fmt --all
      - name: Verify authoring contracts
        run: |
          cargo test --locked --all-features \
            --test authoring_validation_contract \
            --test authoring_trim_path_contract \
            --test authoring_gradient_contract \
            --test authoring_stroke_contract
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Install Cairn 0.9.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
      - name: Reconcile architecture and assert cleanup gates
        run: |
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          set -o pipefail
          cairn scan --json | tee cairn-scan.json
          cairn lint --json | tee cairn-lint.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          findings = json.loads(Path('cairn-scan.json').read_text())['findings']
          blocked = {
              ('CAIRN_RECONCILE_ORPHANED_FILE', 'tests/authoring_trim_path_contract.rs'),
              ('CAIRN_MODULE_OVERSIZED', 'src/authoring/frontend.rs'),
          }
          remaining = {
              (finding.get('code'), finding.get('path'))
              for finding in findings
              if (finding.get('code'), finding.get('path')) in blocked
          }
          if remaining:
              raise SystemExit(f'targeted Cairn findings remain: {sorted(remaining)}')

          frontend_lines = len(Path('src/authoring/frontend.rs').read_text().splitlines())
          if frontend_lines > 500:
              raise SystemExit(f'frontend.rs remains oversized at {frontend_lines} lines')
          print(f'authoring cleanup gates passed; frontend.rs={frontend_lines} lines')
          PY
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/authoring/frontend.rs src/authoring/validation.rs \
            src/authoring/lower.rs src/authoring/mod.rs cairn.blueprint map.json map.md \
            .github/workflows/agent-authoring-validation-cleanup.yml \
            scripts/agent_refactor_authoring_validation.py
          git commit -m "refactor: separate authoring validation helpers"
          git push origin HEAD:agent/authoring-validation-cleanup
