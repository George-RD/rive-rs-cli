name: Verify 257 embedding

on:
  push:
    branches: [agent/256-a1-memory-assets]
    paths: ['.github/workflows/agent-257-preparation.yml']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record exact inputs and browser
        run: |
          mkdir -p target/agent-257
          git rev-parse HEAD | tee target/agent-257/tested-head.txt
          git rev-parse HEAD:src | tee target/agent-257/source-tree.txt
          command -v google-chrome
          google-chrome --version | tee target/agent-257/browser.txt
          echo "RIVE_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Verify visible image and font through the official runtime
        env:
          RIVE_MEMORY_ASSET_EVIDENCE: target/agent-257/runtime
        run: |
          set -o pipefail
          cargo test --locked --test embedded_assets_runtime -- --nocapture 2>&1 | tee target/agent-257/runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-257-runtime
          path: target/agent-257
          retention-days: 14

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Verify the declared Rust version
        run: |
          mkdir -p target/agent-257
          git rev-parse HEAD | tee target/agent-257/tested-head.txt
          rustc --version | tee target/agent-257/rustc.txt
          set -o pipefail
          cargo test --locked --test asset_resolution_contract --test embedded_compile_contract 2>&1 | tee target/agent-257/msrv.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-257-msrv
          path: target/agent-257
          retention-days: 14
