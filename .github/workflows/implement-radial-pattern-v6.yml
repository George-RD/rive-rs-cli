name: Implement radial pattern contract v6

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/implement-radial-pattern-v6.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Apply structural pass with whitespace-tolerant Clippy repairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/radial-evidence
          ruby -ryaml -e '
            workflow = YAML.load_file(ARGV[0])
            step = workflow.fetch("jobs").fetch("implement").fetch("steps").find do |candidate|
              candidate["name"] == "Apply line-structured source edits"
            end
            abort "implementation step missing" unless step
            File.write(ARGV[1], step.fetch("run"))
          ' .github/workflows/implement-radial-pattern-v4.yml /tmp/apply-radial.sh

          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("/tmp/apply-radial.sh")
          script = path.read_text()
          script, generated_count = re.subn(
              r"let generated_items = expansion\s*\.multiplicity\s*"
              r"\.checked_mul\(item_count\)\s*\.unwrap_or\(u64::MAX\);",
              "let generated_items = expansion.multiplicity.saturating_mul(item_count);",
              script,
              count=1,
          )
          script, grid_count = re.subn(
              r"grid\.rows\.checked_mul\(grid\.columns\)"
              r"\.unwrap_or\(u64::MAX\)",
              "grid.rows.saturating_mul(grid.columns)",
              script,
              count=1,
          )
          if generated_count != 1 or grid_count != 1:
              raise SystemExit(
                  f"Clippy repair counts: generated={generated_count}, grid={grid_count}"
              )
          path.write_text(script)
          PY

          bash /tmp/apply-radial.sh

      - name: Prove the radial contract is green
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test authoring_radial_contract \
            2>&1 | tee target/radial-evidence/targeted-green.log

      - name: Run Rust quality gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings \
            2>&1 | tee target/radial-evidence/clippy-green.log
          cargo test --locked --all-features \
            2>&1 | tee target/radial-evidence/rust-green.log

      - name: Reconcile and lint Cairn
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cairn-framework/cairn/releases/download/v0.9.0/cairn-installer.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cairn scan --json | tee target/radial-evidence/cairn-scan.json
          cairn lint --json | tee target/radial-evidence/cairn-lint.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radial-pattern-tdd-evidence-v6
          path: target/radial-evidence
          retention-days: 7

      - name: Commit verified implementation and remove staging workflows
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/implement-radial-pattern-v4.yml \
            .github/workflows/implement-radial-pattern-v6.yml
          git add \
            cairn.blueprint \
            docs/authoring.schema.v0.json \
            map.json \
            meta/todos/todo.visual-authoring-compiler.md \
            src/authoring/frontend.rs \
            src/authoring/limits.rs \
            src/authoring/lower/node.rs \
            src/authoring/lower/pattern.rs \
            src/authoring/validation.rs \
            src/authoring/visual.rs \
            tests/authoring_radial_contract.rs
          git diff --cached --stat
          git commit -m "feat: add bounded radial patterns"
          git push origin HEAD:${{ github.head_ref }}
