name: Finalize AuthoringSpec Stacking V2

on:
  push:
    branches:
      - agent/authoring-stacking-order

permissions:
  actions: write
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authoring-stacking-order
          fetch-depth: 0
      - name: Finalize branch
        run: |
          python3 .github/finalize-authoring-stacking.py
          git rm -f .github/apply-authoring-stacking.py
          git rm -f .github/run-authoring-stacking.py
          git rm -f .github/finalize-authoring-stacking.py
          git rm -f .github/workflows/apply-authoring-stacking.yml
          git rm -f .github/workflows/finalize-authoring-stacking.yml
          git rm -f .github/workflows/finalize-authoring-stacking-v2.yml
      - name: Commit final branch state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml
          git commit -m "ci: retain AuthoringSpec stacking runtime proof"
          git push origin HEAD:agent/authoring-stacking-order
