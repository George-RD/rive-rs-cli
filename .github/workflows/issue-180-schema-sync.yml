name: Issue 180 schema sync

on:
  push:
    branches:
      - issue-180-typed-interaction

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-180-typed-interaction
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Regenerate AuthoringSpec schema
        run: cargo run --locked --quiet -- authoring schema > docs/authoring.schema.v0.json
      - name: Commit generated schema
        run: |
          if git diff --quiet -- docs/authoring.schema.v0.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/authoring.schema.v0.json
          git commit -m "docs(authoring): regenerate v0 schema for #180"
          git push origin HEAD:issue-180-typed-interaction
