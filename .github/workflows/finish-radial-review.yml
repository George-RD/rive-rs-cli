name: Finish radial review cleanup

on:
  push:
    branches:
      - agent/radial-pattern-v0

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/radial-pattern-v0
      - name: Apply focused cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          radial_path = Path("tests/authoring_radial_contract.rs")
          radial = radial_path.read_text()
          comments = """    // The standard library produced different cosine bits for this exact angle
              // across the Linux/Windows and macOS audit runners. The expected bits are
              // pinned to the repository's pure-Rust trigonometric contract.
          """.replace("              //", "    //")
          if comments not in radial:
              raise SystemExit("expected radial comments not found")
          radial = radial.replace(comments, "", 1)

          test_name = "radial_contract_counts_generated_descendants_against_global_budget"
          marker = """#[test]
          fn radial_rejects_derived_angles_outside_scene_number_range() {""".replace("          fn", "fn")
          regression = """#[test]
          fn radial_contract_counts_generated_descendants_against_global_budget() {
              let children = (0..101)
                  .map(|index| rectangle(&format!("tile-{index}")))
                  .collect::<Vec<_>>();
              let input = document(vec![radial(
                  "too-many-descendants",
                  100,
                  literal(20.0, "px"),
                  literal(0.0, "degrees"),
                  literal(3.6, "degrees"),
                  false,
                  json!({
                      "kind": "group",
                      "id": "bundle",
                      "children": children
                  }),
              )]);

              let error = lower_authoring_json(&input)
                  .expect_err("pattern descendants must share the generated-item budget");
              assert!(
                  error.diagnostics.iter().any(|diagnostic| {
                      diagnostic.code == "pattern_expansion_node_limit"
                          && diagnostic.path == "$.visual.nodes[0].copies"
                  }),
                  "missing descendant expansion diagnostic: {:#?}",
                  error.diagnostics
              );
          }

          """.replace("          fn", "fn").replace("              ", "    ").replace("                  ", "        ")
          if test_name not in radial:
              if marker not in radial:
                  raise SystemExit("radial insertion marker not found")
              radial = radial.replace(marker, regression + marker, 1)
          radial_path.write_text(radial)

          temporary_test = Path("tests/authoring_pattern_budget_contract.rs")
          if not temporary_test.exists():
              raise SystemExit("temporary pattern budget test not found")
          temporary_test.unlink()

          Path(".github/workflows/finish-radial-review.yml").unlink()
          PY
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(authoring): cover recursive pattern budget"
          git push origin HEAD:agent/radial-pattern-v0
