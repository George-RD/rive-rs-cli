name: Issue 179 runtime baselines

on:
  push:
    branches:
      - issue-179-typed-behavior
    paths:
      - scripts/issue179_baseline_trigger

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply canonical view-model transition binding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/builder/state_machines.rs")
          text = path.read_text()

          replacements = [
              (
                  "use crate::objects::data_binding::DataBindContext;",
                  "use crate::objects::data_binding::{BindablePropertyBoolean, DataBindContext};",
              ),
              (
                  "        let mut input_name_to_index: HashMap<String, usize> = HashMap::new();\n",
                  "        let mut input_name_to_index: HashMap<String, usize> = HashMap::new();\n"
                  "        let mut bound_bool_input_paths: HashMap<String, (u64, u64)> = HashMap::new();\n",
              ),
              (
                  "                            objects.push(Box::new(DataBindContext::new(\n"
                  "                                property_keys::STATE_MACHINE_BOOL_VALUE as u64,\n"
                  "                                0,\n"
                  "                                encode_id_path(&[view_model_id, property_id]),\n"
                  "                            )));\n",
                  "                            bound_bool_input_paths\n"
                  "                                .insert(name.clone(), (view_model_id, property_id));\n",
              ),
              (
                  "                                            objects.push(Box::new(TransitionBoolCondition::new(\n"
                  "                                                input_id, bool_op,\n"
                  "                                            )));\n",
                  "                                            if let Some(&(view_model_id, property_id)) =\n"
                  "                                                bound_bool_input_paths.get(&condition.input)\n"
                  "                                            {\n"
                  "                                                let vm_op = condition\n"
                  "                                                    .op\n"
                  "                                                    .as_deref()\n"
                  "                                                    .map(parse_condition_op)\n"
                  "                                                    .unwrap_or(0);\n"
                  "                                                objects.push(Box::new(\n"
                  "                                                    TransitionViewModelCondition {\n"
                  "                                                        op_value: vm_op,\n"
                  "                                                    },\n"
                  "                                                ));\n"
                  "                                                objects.push(Box::new(BindablePropertyBoolean {\n"
                  "                                                    property_value: 0,\n"
                  "                                                }));\n"
                  "                                                objects.push(Box::new(DataBindContext::new(\n"
                  "                                                    property_keys::BINDABLE_PROPERTY_BOOLEAN_VALUE\n"
                  "                                                        as u64,\n"
                  "                                                    0,\n"
                  "                                                    encode_id_path(&[view_model_id, property_id]),\n"
                  "                                                )));\n"
                  "                                                objects.push(Box::new(\n"
                  "                                                    TransitionPropertyViewModelComparator,\n"
                  "                                                ));\n"
                  "                                                objects.push(Box::new(\n"
                  "                                                    TransitionValueBooleanComparator { value: *v },\n"
                  "                                                ));\n"
                  "                                            } else {\n"
                  "                                                objects.push(Box::new(\n"
                  "                                                    TransitionBoolCondition::new(input_id, bool_op),\n"
                  "                                                ));\n"
                  "                                            }\n",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected patch snippet not found: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          cargo fmt --all
          cargo test --test authoring_behavior_contract
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/playwright/authoring-behavior-runtime.js --update
      - run: node tests/playwright/authoring-behavior-runtime.js
      - name: Commit runtime evidence
        shell: bash
        run: |
          git rm -f .github/workflows/issue-179-baseline.yml scripts/issue179_baseline_trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/builder/state_machines.rs tests/playwright/baselines/authoring_behavior_binding-resting.png tests/playwright/baselines/authoring_behavior_binding-engaged.png
          git commit -m "fix(authoring): bind state transitions to view models"
          git push
