name: Issue 179 runtime baselines

on:
  push:
    branches:
      - issue-179-typed-behavior
    paths:
      - scripts/issue179_baseline_trigger

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.62.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/playwright/authoring-behavior-runtime.js --update
      - run: node tests/playwright/authoring-behavior-runtime.js
      - name: Commit runtime evidence
        shell: bash
        run: |
          git rm -f .github/workflows/issue-179-baseline.yml scripts/issue179_baseline_trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/playwright/baselines/authoring_behavior_binding-resting.png tests/playwright/baselines/authoring_behavior_binding-engaged.png
          git commit -m "test(authoring): retain behavior runtime evidence"
          git push
