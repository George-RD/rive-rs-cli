name: Model blend workbench

on:
  push:
    branches: [agent/authoring-model-blends]

permissions:
  contents: write

concurrency:
  group: model-blend-workbench
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Apply bounded source patch when present
        run: |
          if test -f scripts/model-blend-workbench.py; then
            python3 scripts/model-blend-workbench.py
          fi
          cargo fmt
      - name: Regenerate authoring schema after implementation
        run: |
          if test -f scripts/model-blend-workbench.py; then
            cargo test --test authoring_contract regenerate_published_authoring_schema -- --ignored
          fi
      - name: Retain formatted source on feature branch
        run: |
          git add src tests docs examples meta cairn.blueprint ROADMAP.md
          if ! git diff --cached --quiet; then
            test "$(git ls-remote origin refs/heads/agent/authoring-model-blends | cut -f1)" = "$GITHUB_SHA"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat(authoring): retain model-bound blend implementation and contracts (#241)"
            git push origin HEAD:refs/heads/agent/authoring-model-blends
          fi
      - name: Record source revision
        if: always()
        run: |
          git rev-parse HEAD | tee source-head.txt
          git archive HEAD -o source.tar
      - name: Bound direct-blend contracts
        run: |
          set -o pipefail
          cargo test --locked --test authoring_model_blend_contract 2>&1 | tee model-blend-tests.log
      - name: All Rust tests
        run: |
          set -o pipefail
          cargo test --locked --all-features 2>&1 | tee model-blend-all-tests.log
      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | tee model-blend-clippy.log
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Input and model blend runtime
        run: |
          set -o pipefail
          npm install --no-save --no-package-lock playwright@1.62.0
          npx playwright install --with-deps chromium
          node tests/playwright/authoring-direct-blend-runtime.js 2>&1 | tee model-blend-input-runtime.log
          node tests/playwright/authoring-direct-blend-runtime.js --model-bound 2>&1 | tee model-blend-runtime.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-blend-workbench
          path: |
            source-head.txt
            source.tar
            model-blend-*.log
            target/playwright-behavior/direct-blend
            target/playwright-behavior/model-blend
          retention-days: 7
