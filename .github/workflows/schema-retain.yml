name: Retain reviewed schema candidate

on:
  pull_request:
    types: [edited]

permissions:
  contents: read

jobs:
  retain:
    if: >-
      github.event.changes.body != null &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/256-b2-capability-matrix' &&
      contains(github.event.pull_request.body, '<!-- retain-schema-266 -->') &&
      !contains(github.event.changes.body.from, '<!-- retain-schema-266 -->')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      BRANCH: agent/256-b2-capability-matrix
      CAPTURE_HEAD: 41d8a7969c6db3036f5642496596e86daed5e101
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: schema-reference-41d8a7969c6db3036f5642496596e86daed5e101
          run-id: 34715128718
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/schema-full
      - name: Normalize the already inspected capture into its first retained candidate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e parity/cli-reference/schema-baseline/facts.json.xz
          test ! -e parity/cli-reference/schema-baseline/snapshot.json
          mkdir -p parity/cli-reference/schema-baseline
          python3 parity/cli-reference/capabilities.py refresh "$RUNNER_TEMP/schema-full" --expected-head "$CAPTURE_HEAD" --output parity/cli-reference/schema-baseline/facts.json.xz
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          directory = Path('parity/cli-reference/schema-baseline')
          pin = {'schema_version': 1, 'archive': 'facts.json.xz',
                 'archive_sha256': hashlib.sha256((directory / 'facts.json.xz').read_bytes()).hexdigest(),
                 'source_head': '41d8a7969c6db3036f5642496596e86daed5e101',
                 'workflow_run': 34715128718, 'workflow_artifact': 10304268395,
                 'artifact_zip_sha256': '72905a44b8d2a955d7124c9c2b72098b1f0205e472c4d837e967c121dd99828a'}
          assert pin['archive_sha256'] == 'cb46f6bd7e1e8636ba7bfc00975ee7a2357ef9bacdb55285982391c3883d8bcf', 'candidate differs from the independently inspected normalization'
          with (directory / 'snapshot.json').open('x') as stream:
              stream.write(json.dumps(pin, indent=2) + '\n')
          PY
          python3 -m unittest discover -s parity/cli-reference -p 'test_*.py' -v
          python3 parity/cli-reference/capabilities.py check --json
      - name: Retain only the two verified candidate files on the draft branch
        shell: bash
        run: |
          set -euo pipefail
          tested=$(git rev-parse HEAD)
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$tested"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add parity/cli-reference/schema-baseline/facts.json.xz parity/cli-reference/schema-baseline/snapshot.json
          git commit -m 'test(reference): retain reviewed normalized schema facts (#266)'
          git push origin "HEAD:refs/heads/$BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-schema-baseline
          path: parity/cli-reference/schema-baseline/
          retention-days: 7
