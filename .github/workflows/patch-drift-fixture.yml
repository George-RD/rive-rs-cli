name: Patch drift fixture

on:
  push:
    branches: [agent/cairn-foundation]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cairn-foundation
      - name: Update the intentionally wrong hash to a valid SHA-256 shape
        run: |
          if grep -q '"bounce-case": "deadbeefdeadbeef"' tests/e2e.rs; then
            sed -i 's/"bounce-case": "deadbeefdeadbeef"/"bounce-case": "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"/' tests/e2e.rs
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add tests/e2e.rs
            git commit -m "test: use valid drift baseline fixture"
            git push origin HEAD:agent/cairn-foundation
          fi
