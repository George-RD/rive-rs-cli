name: Work Item
description: A single piece of work to be driven through the campaign DAG.
labels: []
body:
  - type: input
    id: area
    attributes:
      label: Area
      description: encoder, builder, objects, cli, validator, ai, qa
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - p0
        - p1
        - p2
        - p3
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: checkboxes
    id: acceptance
    attributes:
      label: Acceptance Criteria
      options:
        - label: Implementation complete
        - label: /green gate passes
        - label: /review PASS recorded in war-log
        - label: PR merged
